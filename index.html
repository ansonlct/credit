<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<title>信用卡優惠額度</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:rgba(255,255,255,.94);
  --text:#17191d;
  --muted:#7a8089;
  --line:#e7e9ed;
  --soft:#f1f3f5;
  --good:#137a56;
  --bad:#bf4545;
  --shadow:0 10px 30px rgba(20,26,34,.055);
  --shadow-strong:0 16px 42px rgba(20,26,34,.10);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{
  margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
body{
  background:
    radial-gradient(circle at 15% -10%, rgba(93,135,255,.10), transparent 30%),
    radial-gradient(circle at 100% 0%, rgba(91,210,164,.08), transparent 28%),
    var(--bg);
  min-height:100vh;
}
body{padding-bottom:96px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;padding:18px 14px 30px}

.top{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 -14px 16px;padding:12px 14px 11px;
  background:rgba(244,246,248,.88);
  border-bottom:1px solid rgba(226,229,234,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:box-shadow .2s ease,background .2s ease;
}
.top.is-scrolled{
  background:rgba(250,251,252,.96);
  box-shadow:0 7px 22px rgba(20,26,34,.07);
}
.title{
  font-size:23px;font-weight:850;letter-spacing:-.45px;
  background:linear-gradient(135deg,#15171a,#444b55);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.top-actions{display:flex;gap:7px;align-items:center}
.month{
  width:120px;border:0;background:transparent;color:var(--muted);
  font-weight:700;padding:7px 0
}
.icon-btn{
  width:39px;height:39px;border:1px solid rgba(224,227,232,.95);border-radius:12px;
  background:rgba(255,255,255,.88);display:grid;place-items:center;font-size:18px;
  box-shadow:0 5px 16px rgba(20,26,34,.05);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.icon-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(20,26,34,.08);background:#fff}
.icon-btn:active{transform:translateY(0) scale(.98)}

.new-target-btn{
  border:1px solid rgba(221,224,229,.95);
  border-radius:12px;background:rgba(255,255,255,.9);
  color:var(--text);padding:9px 12px;font-size:12px;font-weight:850;
  box-shadow:0 5px 16px rgba(20,26,34,.05);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.new-target-btn:hover{
  transform:translateY(-1px);background:#fff;
  box-shadow:0 8px 20px rgba(20,26,34,.08)
}
.new-target-btn:active{transform:translateY(0) scale(.97)}

.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin:0 2px 8px
}
.section-head h2{font-size:16px;margin:0;font-weight:850;letter-spacing:-.18px}
.section-head span{font-size:11px;color:var(--muted);font-weight:650}

.goals{
  background:var(--card);
  border:1px solid rgba(226,229,234,.92);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.goal{
  position:relative;
  padding:14px 14px 13px;
  border-bottom:1px solid rgba(231,233,237,.95);
  transition:background .18s ease;
}
.goal:last-child{border-bottom:0}
.goal:hover{background:rgba(248,249,251,.72)}
.goal::before{
  content:"";
  position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--bar-start,#5967ff),var(--bar-end,#8d73ff));
  opacity:.9;
}
.goal-card{
  font-size:11px;color:var(--muted);font-weight:760;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em
}
.goal-title{
  font-size:14.5px;font-weight:850;line-height:1.35;margin-bottom:5px;letter-spacing:-.1px
}
.goal-meta{
  font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:9px
}
.goal-progress-row{
  display:flex;align-items:center;gap:9px
}
.progress{
  position:relative;flex:1;height:8px;
  background:rgba(225,228,233,.88);
  border-radius:999px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(18,23,29,.06);
}
.progress>div{
  height:100%;
  width:var(--target-width,0%);
  background:linear-gradient(90deg,var(--bar-start,#5967ff),var(--bar-end,#8d73ff));
  border-radius:999px;
  box-shadow:0 0 12px var(--bar-glow,rgba(89,103,255,.22));
  transform-origin:left center;
  animation:progressGrow .82s cubic-bezier(.22,.78,.24,1) both;
  animation-delay:var(--bar-delay,0ms);
}
.progress>div::after{
  content:"";
  display:block;width:28%;height:100%;margin-left:auto;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
@keyframes progressGrow{
  from{transform:scaleX(0);opacity:.55}
  to{transform:scaleX(1);opacity:1}
}
.goal-percent{
  flex:0 0 auto;min-width:38px;text-align:right;font-size:12px;font-weight:850;
  color:var(--bar-start,#4f5fff)
}
.goal-status{
  margin-top:6px;font-size:11px;color:var(--muted);line-height:1.4
}
.goal-status b{color:var(--text)}
.goal-days{
  display:inline-flex;align-items:center;margin-left:6px;font-size:10px;font-weight:780;
  padding:2px 7px;border-radius:999px;background:rgba(241,243,245,.95);
  vertical-align:1px;border:1px solid rgba(228,230,234,.8)
}
.goal-days.good{color:var(--good);background:rgba(19,122,86,.08);border-color:rgba(19,122,86,.10)}
.goal-days.bad{color:var(--bad);background:rgba(191,69,69,.08);border-color:rgba(191,69,69,.10)}

.goal{
  cursor:pointer;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  column-gap:10px;
}
.goal-body{min-width:0}
.goal-modify{
  align-self:center;
  width:0;opacity:0;overflow:hidden;pointer-events:none;
  transform:translateX(16px) scale(.86);
  border:0;border-radius:10px;background:#17191d;color:#fff;
  padding:0;font-size:11px;font-weight:850;
  transition:
    width .23s cubic-bezier(.22,.8,.2,1),
    opacity .17s ease,
    transform .23s cubic-bezier(.22,.8,.2,1),
    padding .23s ease;
  position:relative;z-index:3
}
.goal.open .goal-modify{
  width:54px;opacity:1;pointer-events:auto;
  transform:translateX(0) scale(1);padding:8px 0
}
.goal.completed .goal-modify{
  background:rgba(103,72,8,.88)
}
.history-head{margin-top:20px}
.tx-list{
  background:var(--card);border:1px solid rgba(226,229,234,.92);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.tx{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  padding:12px 13px;border-bottom:1px solid var(--line);
  transition:background .16s ease
}
.tx:hover{background:rgba(248,249,251,.72)}
.tx:last-child{border-bottom:0}
.tx-card{font-size:13px;font-weight:750}
.tx-sub{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  margin-top:3px;font-size:10.5px;color:var(--muted)
}
.pill{background:var(--soft);padding:2px 6px;border-radius:999px}
.tx-amount{align-self:center;font-size:14px;font-weight:800}

.tx{
  position:relative;overflow:hidden;cursor:pointer;
  grid-template-columns:1fr auto auto;
  align-items:center;
}
.tx-content{
  min-width:0;
  transition:transform .24s cubic-bezier(.22,.8,.2,1),opacity .2s ease
}
.tx-amount{
  transition:transform .24s cubic-bezier(.22,.8,.2,1)
}
.tx-delete{
  width:0;opacity:0;transform:translateX(16px) scale(.82);
  overflow:hidden;border:0;border-radius:10px;
  background:#fff0f0;color:var(--bad);font-size:18px;font-weight:800;
  padding:0;pointer-events:none;
  transition:
    width .24s cubic-bezier(.22,.8,.2,1),
    opacity .18s ease,
    transform .24s cubic-bezier(.22,.8,.2,1),
    padding .24s ease;
}
.tx.open .tx-delete{
  width:38px;opacity:1;transform:translateX(0) scale(1);
  padding:8px 0;pointer-events:auto
}
.tx.open .tx-amount{transform:translateX(-2px)}
.tx.deleting{
  animation:txDelete .3s cubic-bezier(.4,0,.2,1) forwards
}
@keyframes txDelete{
  to{opacity:0;transform:translateX(28px) scale(.97);max-height:0;padding-top:0;padding-bottom:0}
}
.empty{
  padding:30px 14px;text-align:center;color:var(--muted);font-size:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(247,248,250,.55))
}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(244,246,248,0),rgba(244,246,248,.88) 28%,rgba(244,246,248,.98) 62%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.add-btn{
  display:block;width:min(692px,100%);margin:0 auto;border:0;border-radius:16px;
  background:linear-gradient(135deg,#15171a,#2d3239);
  color:#fff;padding:14px 16px;font-size:15px;font-weight:850;
  box-shadow:0 12px 28px rgba(20,24,30,.18);
  transition:transform .16s ease, box-shadow .16s ease, filter .16s ease
}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 15px 34px rgba(20,24,30,.22);filter:brightness(1.04)}
.add-btn:active{transform:translateY(0) scale(.99)}

.modal{
  position:fixed;inset:0;z-index:50;background:rgba(22,25,29,.34);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)
}
.modal.show{display:flex}
.modal.closing .sheet{animation:sheetDown .2s ease both}
.modal.closing{animation:backdropOut .2s ease both}
@keyframes sheetDown{to{transform:translateY(18px);opacity:0}}
@keyframes backdropOut{to{background:rgba(22,25,29,0);backdrop-filter:blur(0)}}
.sheet{
  width:min(720px,100%);max-height:90vh;overflow:auto;
  background:rgba(255,255,255,.98);
  border-radius:24px 24px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 50px rgba(17,22,29,.18);
  animation:sheetUp .24s cubic-bezier(.22,.8,.2,1) both;
}
@keyframes sheetUp{
  from{transform:translateY(18px);opacity:.5}
  to{transform:translateY(0);opacity:1}
}
.sheet-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 -14px 14px;padding:0 14px 12px;
}
#settingsModal .sheet-head{
  position:sticky;top:-16px;z-index:10;
  background:rgba(255,255,255,.96);
  padding-top:16px;
  border-bottom:1px solid rgba(228,230,234,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sheet-head h3{font-size:17px;margin:0}
.close{
  width:35px;height:35px;border:0;border-radius:50%;
  background:var(--soft);font-size:19px;color:#4f555d;
  transition:transform .14s ease, background .14s ease
}
.close:hover{background:#e8eaee;transform:rotate(4deg)}
.close:active{transform:scale(.96)}

.field{margin-bottom:11px}
.field label{
  display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px
}
input,select{
  width:100%;border:1px solid var(--line);border-radius:12px;
  background:#fff;padding:11px 10px;outline:none;color:var(--text);
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease
}
input:focus,select:focus{
  border-color:#aeb5bf;
  box-shadow:0 0 0 3px rgba(95,111,255,.08);
  background:#fff
}
.confirm{
  width:100%;border:0;border-radius:13px;
  background:linear-gradient(135deg,#15171a,#2f343b);
  color:#fff;padding:13px;font-weight:850;
  box-shadow:0 9px 22px rgba(18,22,28,.14);
  transition:transform .15s ease, box-shadow .15s ease
}
.confirm:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(18,22,28,.18)}
.confirm:active{transform:translateY(0) scale(.99)}


.offer-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:#eef0f3;padding:4px;border-radius:13px;margin-bottom:12px
}
.offer-tab{
  border:0;background:transparent;border-radius:10px;padding:9px 8px;
  font-size:12px;font-weight:820;color:var(--muted);
  transition:background .15s ease,color .15s ease,box-shadow .15s ease
}
.offer-tab.active{
  background:#fff;color:var(--text);
  box-shadow:0 3px 10px rgba(20,26,34,.07)
}
.offer-panel.hidden{display:none}

.settings-editor.hidden{display:none!important}
.settings-card{
  border:1px solid rgba(226,229,234,.95);border-radius:16px;
  padding:13px;margin-bottom:10px;background:#fff;
  box-shadow:0 6px 18px rgba(20,26,34,.04)
}
.settings-title{
  display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px
}
.settings-title h4{margin:0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{grid-column:1/-1}
.subhead{
  font-size:11px;font-weight:800;color:var(--muted);
  margin:4px 0 8px;padding-top:9px;border-top:1px solid var(--line)
}
.toggle-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0 3px
}
.toggle-row span{font-size:12px;font-weight:750}
.switch{
  position:relative;width:44px;height:26px;background:#d9dce1;border-radius:999px;cursor:pointer
}
.switch input{display:none}
.switch i{
  position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;
  box-shadow:0 1px 4px rgba(0,0,0,.18);transition:.16s
}
.switch input:checked + i{left:21px}
.switch:has(input:checked){background:#111}
.welcome-fields.hidden{display:none}
.save-row{display:flex;gap:8px;margin-top:8px}
.save-row button{
  flex:1;border:0;border-radius:11px;padding:10px;font-size:12px;font-weight:750
}
.save{background:linear-gradient(135deg,#17191d,#30353c);color:#fff}
.remove{background:#fff1f1;color:var(--bad)}
.add-card{
  width:100%;border:1px dashed #cfd2d7;border-radius:13px;background:#fafafa;
  padding:11px;font-weight:750
}
.tiny{font-size:10.5px;color:var(--muted);line-height:1.4}

@media(max-width:460px){
  .grid2{grid-template-columns:1fr 1fr}
}


/* 簽賬類別標籤 */
.category-input-row{display:grid;grid-template-columns:1fr 42px;gap:7px}
.category-add{
  border:0;border-radius:11px;background:var(--soft);font-weight:900;font-size:18px;
  color:#4f5660;transition:transform .15s ease,background .15s ease
}
.category-add:hover{background:#e8ebef;transform:translateY(-1px)}
.category-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cat-chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid #e1e4e9;
  border-radius:999px;background:#f6f7f9;padding:5px 8px;font-size:10.5px;
  font-weight:760;color:#4f5660
}
.cat-chip span{font-size:13px;color:#9298a1;line-height:1}

/* 新增消費：計入目標 */
.target-label{font-size:11px;color:var(--muted);font-weight:700;margin:2px 0 6px}
.target-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.target-pick{
  position:relative;display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:12px;background:#fff;
  padding:10px 11px;cursor:pointer;user-select:none;
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease
}
.target-pick input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.target-dot{
  width:18px;height:18px;border-radius:6px;border:1.5px solid #c9cdd4;
  display:grid;place-items:center;flex:0 0 auto;font-size:12px;color:white;
  transition:.15s ease
}
.target-pick strong{font-size:11.5px}
.target-pick small{display:block;color:var(--muted);font-size:9.5px;margin-top:1px}
.target-pick:has(input:checked){
  border-color:rgba(70,85,230,.24);background:rgba(88,103,255,.055);
  box-shadow:0 3px 12px rgba(50,62,160,.05)
}
.target-pick:has(input:checked) .target-dot{
  border-color:#5967ff;background:#5967ff
}
.target-pick:has(input:checked) .target-dot::after{content:"✓"}
.target-pick.welcome:has(input:checked){
  border-color:rgba(194,132,27,.25);background:rgba(245,182,54,.07)
}
.target-pick.welcome:has(input:checked) .target-dot{
  border-color:#c98b24;background:#c98b24
}

/* 達標慶祝：白色由左掃成金色 */
.goal > *{position:relative;z-index:2}
.goal.completed{overflow:hidden}
.goal.completed::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(105deg,rgba(255,255,255,.05),rgba(255,239,182,.86) 55%,rgba(250,219,113,.66));
  transform:scaleX(0);transform-origin:left center;
  animation:goldSweep .9s cubic-bezier(.2,.76,.22,1) .18s forwards
}
@keyframes goldSweep{
  0%{transform:scaleX(0)}
  100%{transform:scaleX(1)}
}
.trophy{
  display:inline-block;margin-left:5px;font-size:15px;vertical-align:-1px;
  opacity:0;transform:scale(.35) rotate(-12deg);
  animation:trophyPop .48s cubic-bezier(.2,1.35,.35,1) 1.02s forwards
}
@keyframes trophyPop{
  to{opacity:1;transform:scale(1) rotate(0)}
}
.goal.completed .goal-card,
.goal.completed .goal-meta,
.goal.completed .goal-status{color:#76601e}
.goal.completed .goal-percent{color:#8a6410}
.goal.completed .goal-days.good{
  color:#76550d;background:rgba(255,255,255,.48);border-color:rgba(139,101,16,.12)
}
.tx-target{
  display:inline-flex;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800;
  background:#eef0ff;color:#5967c8
}
.tx-target.welcome{background:#fff4d7;color:#9b6a12}


button,label.switch,.offer-tab,.cat-chip,.target-pick,.tx{
  -webkit-tap-highlight-color:transparent
}
.offer-panel{
  animation:panelFade .22s ease both
}
@keyframes panelFade{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

.existing-list{
  display:grid;gap:8px;margin-bottom:12px
}
.existing-card{
  position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;
  align-items:center;overflow:hidden;
  border:1px solid rgba(226,229,234,.95);border-radius:14px;
  background:#fff;padding:11px 12px;cursor:pointer;
  box-shadow:0 5px 16px rgba(20,26,34,.035);
  transition:background .16s ease,transform .16s ease
}
.existing-card:hover{background:#fafbfc}
.existing-card:active{transform:scale(.995)}
.existing-card-main{min-width:0}
.existing-card-name{
  font-size:13px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.existing-card-sub{
  margin-top:3px;font-size:10.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.modify-btn{
  width:0;opacity:0;overflow:hidden;pointer-events:none;
  transform:translateX(14px) scale(.88);
  border:0;border-radius:10px;background:#111;color:#fff;
  padding:0;font-size:11px;font-weight:820;
  transition:width .22s cubic-bezier(.22,.8,.2,1),
             opacity .16s ease,
             transform .22s cubic-bezier(.22,.8,.2,1),
             padding .22s ease
}
.existing-card.open .modify-btn{
  width:54px;opacity:1;pointer-events:auto;
  transform:translateX(0) scale(1);padding:8px 0
}
.settings-editor.hidden{display:none!important}
.settings-card{
  animation:cardIn .28s cubic-bezier(.22,.8,.2,1) both
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.tx{
  animation:txIn .28s cubic-bezier(.22,.8,.2,1) both
}
@keyframes txIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;

    cardKey:t.cardKey || uid(),
    name:t.name || '未命名信用卡',
    targetType:type,
    rebateRate:Number(t.rebateRate ?? (Number(t.baseRate||0)+Number(t.bonusRate||0)) ?? 0),
    spendRequirement:Number(t.spendRequirement ?? t.monthlyThreshold ?? 0),
    spendCap:Number(t.spendCap ?? t.bonusSpendCap ?? 0),
    rebateCategories:Array.isArray(t.rebateCategories) ? t.rebateCategories.filter(Boolean) : (t.selectedCategory?[t.selectedCategory]:[]),
    rebateEndDate:t.rebateEndDate || '',
    approvalDate:t.approvalDate || '',
    welcomeDays:Number(t.welcomeDays ?? 90),
    welcomeRequirement:Number(t.welcomeRequirement ?? t.welcomeSpend ?? 0),
    welcomeRewardType:t.welcomeRewardType || '現金回贈',
    welcomeReward:Number(t.welcomeReward ?? t.welcomeCashback ?? 0),
    createdAt:Number(t.createdAt||0),
    ...(t._temporary?{_temporary:true}:{})
  };
}
function targetShortLabel(t){
  if(t.targetType==='welcome') return `迎新 · ${t.welcomeRewardType==='飛行里數'?Number(t.welcomeReward||0).toLocaleString('en-HK')+' 里':money(t.welcomeReward)}`;
  const rate=Number(t.rebateRate||0);
  return `回贈 · ${rate.toFixed(Number.isInteger(rate)?0:1)}%`;
}
function targetDetailLabel(t){
  if(t.targetType==='welcome'){
    if(t.approvalDate) return `${t.approvalDate} 起 · ${Math.max(1,Number(t.welcomeDays||1))} 日內 · 要求 ${money(t.welcomeRequirement)}`;
    return `未設定批卡日期 · 要求 ${money(t.welcomeRequirement)}`;
  }
  const cats=Array.isArray(t.rebateCategories)&&t.rebateCategories.length?t.rebateCategories.join('、'):'所有簽賬類別';
  return `${cats}${t.rebateEndDate?' · 至 '+t.rebateEndDate:''}`;
}

function migrateLegacyState(old){
  const legacyCards=Array.isArray(old?.cards)?old.cards:[];
  const targets=[];
  const sourceMap=new Map();
  const nameKeyMap=new Map();

  legacyCards.forEach((c,index)=>{
    const name=c.name || '未命名信用卡';
    const n=normalizeCardName(name) || `legacy-${index}`;
    if(!nameKeyMap.has(n)) nameKeyMap.set(n,c.cardKey || uid());
    const cardKey=nameKeyMap.get(n);
    const targetIds=[];

    const hasRebate=c.targetType ? c.targetType==='rebate' : (c.hasRebate ?? true);
    const hasWelcome=c.targetType ? c.targetType==='welcome' : !!(c.hasWelcome ?? (c.approvalDate || c.welcomeSpend || c.welcomeRequirement));

    if(hasRebate){
      const t=normalizeTarget({...c,id:c.targetType?c.id:`${c.id||uid()}__rebate`,cardKey,name,targetType:'rebate'});
      targets.push(t);targetIds.push({id:t.id,type:'rebate'});
    }
    if(hasWelcome){
      const t=normalizeTarget({...c,id:c.targetType?c.id:`${c.id||uid()}__welcome`,cardKey,name,targetType:'welcome'});
      // Avoid duplicate id if a malformed legacy item says both types while already targetType.
      if(targets.some(x=>x.id===t.id)) t.id=uid();
      targets.push(t);targetIds.push({id:t.id,type:'welcome'});
    }
    sourceMap.set(c.id,{cardKey,name,targetIds});
  });

  const transactions=(Array.isArray(old?.transactions)?old.transactions:[]).map(t=>{
    const src=sourceMap.get(t.cardId);
    let ids=[];
    if(src){
      src.targetIds.forEach(x=>{
        if(x.type==='rebate' && t.qualifiesRebate!==false) ids.push(x.id);
        if(x.type==='welcome' && t.qualifiesWelcome!==false) ids.push(x.id);
      });
    }
    const refs=ids.map(id=>{
      const target=targets.find(x=>x.id===id);
      return target?{id:target.id,type:target.targetType,label:targetShortLabel(target)}:null;
    }).filter(Boolean);
    return {
      id:t.id || uid(),
      cardKey:src?.cardKey || t.cardKey || uid(),
      cardName:src?.name || t.cardName || '已刪除信用卡',
      amount:Number(t.amount||0),
      category:t.category || '一般簽賬',
      targetIds:ids,
      targetRefs:refs,
      date:t.date || localDateStr(),
      createdAt:Number(t.createdAt||Date.now())
    };
  });

  return {cards:targets,transactions,month:old?.month || old?.selectedMonth || localMonthStr()};
}
function normalizeV4State(x){
  const cards=(Array.isArray(x?.cards)?x.cards:[]).map(normalizeTarget);
  const transactions=(Array.isArray(x?.transactions)?x.transactions:[]).map(t=>{
    const ids=Array.isArray(t.targetIds)?t.targetIds.filter(Boolean):[];
    const refs=Array.isArray(t.targetRefs)?t.targetRefs.filter(Boolean):ids.map(id=>{
      const target=cards.find(x=>x.id===id);
      return target?{id:target.id,type:target.targetType,label:targetShortLabel(target)}:null;
    }).filter(Boolean);
    return {
      id:t.id || uid(),
      cardKey:t.cardKey || cards.find(c=>c.id===t.cardId)?.cardKey || uid(),
      cardName:t.cardName || cards.find(c=>c.cardKey===t.cardKey)?.name || cards.find(c=>c.id===t.cardId)?.name || '已刪除信用卡',
      amount:Number(t.amount||0),
      category:t.category || '一般簽賬',
      targetIds:ids,
      targetRefs:refs,
      date:t.date || localDateStr(),
      createdAt:Number(t.createdAt||Date.now())
    };
  });
  return {cards,transactions,month:x?.month || localMonthStr()};
}
function load(){
  try{
    const current=JSON.parse(localStorage.getItem(KEY));
    if(current && Array.isArray(current.cards)) return normalizeV4State(current);
    for(const k of LEGACY_KEYS){
      const old=JSON.parse(localStorage.getItem(k));
      if(old && Array.isArray(old.cards)){
        const migrated=migrateLegacyState(old);
        localStorage.setItem(KEY,JSON.stringify(migrated));
        return migrated;
      }
    }
  }catch(e){console.warn('load failed',e)}
  return {cards:[],transactions:[],month:localMonthStr()};
}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}

function getPhysicalCards(){
  const map=new Map();
  state.cards.filter(t=>!t._temporary).forEach(t=>{
    const key=t.cardKey || t.id;
    if(!map.has(key)) map.set(key,{cardKey:key,name:t.name,targets:[]});
    const card=map.get(key);
    if(t.name) card.name=t.name;
    card.targets.push(t);
  });
  return [...map.values()];
}
function cardByKey(cardKey){return getPhysicalCards().find(c=>c.cardKey===cardKey)||null}
function txIncludesTarget(t,targetId){return Array.isArray(t.targetIds)&&t.targetIds.includes(targetId)}
function targetMonthSpend(target){
  return state.transactions
    .filter(t=>txIncludesTarget(t,target.id) && String(t.date).slice(0,7)===state.month)
    .filter(t=>target.targetType!=='rebate' || !target.rebateEndDate || t.date<=target.rebateEndDate)
    .reduce((s,t)=>s+Number(t.amount||0),0);
}
function rewardLabel(target){
  return target.welcomeRewardType==='飛行里數'
    ? `${Number(target.welcomeReward||0).toLocaleString('en-HK')} 里`
    : money(target.welcomeReward);
}

function getGoalRows(){
  const rows=[];
  const today=localDateStr();
  const currentMonth=localMonthStr();

  state.cards.filter(t=>!t._temporary).forEach(t=>{
    if(t.targetType==='rebate'){
      const spent=targetMonthSpend(t);
      const cap=Number(t.spendCap||0);
      const req=Number(t.spendRequirement||0);
      const monthlyEnd=monthEnd(state.month);
      let end=monthlyEnd;
      if(t.rebateEndDate && t.rebateEndDate<end) end=t.rebateEndDate;
      const selectedMonthStart=state.month+'-01';
      const ended=(t.rebateEndDate && selectedMonthStart>t.rebateEndDate) || state.month<currentMonth || (t.rebateEndDate && today>t.rebateEndDate);
      const remainDays=ended?0:daysLeft(end);
      const progressTarget=cap>0?cap:req;
      const progress=pct(spent,progressTarget);
      let status='';
      if(spent<req) status=`已簽 ${money(spent)}，尚欠 ${money(req-spent)} 進入門檻`;
      else if(cap>0 && spent<cap) status=`已簽 ${money(spent)}，尚餘 ${money(cap-spent)} 消費額`;
      else if(cap>0 && spent>=cap) status=`已簽 ${money(spent)}，已用盡本期額度`;
      else status=`已簽 ${money(spent)}，已達簽賬要求`;
      const rate=Number(t.rebateRate||0);
      rows.push({
        targetId:t.id,card:t.name,title:`簽賬回贈 · ${rate.toFixed(Number.isInteger(rate)?0:1)}%`,
        meta:`下限 ${money(req)} · 上限 ${cap>0?money(cap):'—'}${t.rebateEndDate?` · 至 ${t.rebateEndDate}`:' · 每月重置'}`,
        days:ended?'已完結':`${remainDays}日`,dayClass:ended?'bad':(cap>0&&spent>=cap?'good':''),
        progress,percent:`${Math.round(progress)}%`,status,completed:progressTarget>0&&spent>=progressTarget
      });
    }else{
      const req=Number(t.welcomeRequirement||0);
      let accum=0,endStr='',daysText='未設定日期',dayClass='',progress=0,status='尚未設定批卡日期';
      if(t.approvalDate){
        endStr=addDays(t.approvalDate,Math.max(1,Number(t.welcomeDays||1)));
        accum=state.transactions
          .filter(tx=>txIncludesTarget(tx,t.id) && tx.date>=t.approvalDate && tx.date<=endStr)
          .reduce((s,tx)=>s+Number(tx.amount||0),0);
        progress=pct(accum,req);
        if(req>0&&accum>=req){daysText='已完成';dayClass='good';status=`已簽 ${money(accum)}，已達迎新要求`}
        else if(today>endStr){daysText='已完結';dayClass='bad';status=`已簽 ${money(accum)}，尚欠 ${money(Math.max(0,req-accum))}`}
        else{daysText=`${daysLeft(endStr)}日`;status=`已簽 ${money(accum)}，尚欠 ${money(Math.max(0,req-accum))} 簽賬要求`}
      }
      rows.push({
        targetId:t.id,card:t.name,title:`迎新簽賬 · ${esc(t.welcomeRewardType)} ${rewardLabel(t)}`,
        meta:`要求 ${money(req)}`,days:daysText,dayClass,progress,percent:`${Math.round(progress)}%`,status,
        completed:req>0&&accum>=req
      });
    }
  });
  return rows;
}

let txCardScrollFrame=0,txCardCommitTimer=0;
function txCardTone(cardKey=''){
  let hash=0;for(const ch of String(cardKey))hash=(hash*31+ch.charCodeAt(0))>>>0;return hash%6;
}
function renderCardOptions(){

    <div class="tx-wallet-card">

  carousel.scrollLeft=0;bindTxCardCarousel();requestAnimationFrame(()=>updateTxCardCarouselVisual(true));

function selectedTxCard(){return cardByKey(document.getElementById('txCard')?.value||'')}
function updateTxCardCarouselVisual(commit=true){
  const carousel=document.getElementById('txCardCarousel'),input=document.getElementById('txCard'),label=document.getElementById('txCardSelectedLabel');
  if(!carousel||!input)return;
  const slides=[...carousel.querySelectorAll('.tx-card-slide')];if(!slides.length)return;
  const center=carousel.scrollLeft+carousel.clientWidth/2,maxDist=Math.max(1,carousel.clientWidth*.72);
  let nearest=slides[0],nearestDist=Infinity;
  slides.forEach(slide=>{
    const slideCenter=slide.offsetLeft+slide.offsetWidth/2,dist=Math.abs(slideCenter-center),ratio=Math.min(1,dist/maxDist);
    slide.style.setProperty('--card-scale',(1-ratio*.09).toFixed(3));slide.style.setProperty('--card-y',`${(ratio*8).toFixed(1)}px`);slide.style.setProperty('--card-opacity',(1-ratio*.56).toFixed(3));
    if(dist<nearestDist){nearestDist=dist;nearest=slide}
  });
  slides.forEach(slide=>slide.classList.toggle('is-active',slide===nearest));
  if(!commit)return;
  const key=nearest.dataset.cardKey||'',changed=input.value!==key;input.value=key;
  const card=cardByKey(key);if(label){label.classList.toggle('has-card',!!card);label.textContent=card?.name||''}
  if(changed)input.dispatchEvent(new Event('change',{bubbles:true}));
  else renderTxCategories();
}
function bindTxCardCarousel(){
  const carousel=document.getElementById('txCardCarousel');if(!carousel)return;
  carousel.querySelectorAll('.tx-card-slide').forEach(slide=>{
    slide.onclick=()=>{const target=slide.offsetLeft-(carousel.clientWidth-slide.offsetWidth)/2;carousel.scrollTo({left:target,behavior:'smooth'});clearTimeout(txCardCommitTimer);txCardCommitTimer=setTimeout(()=>updateTxCardCarouselVisual(true),220)};
  });
  carousel.onscroll=()=>{if(txCardScrollFrame)cancelAnimationFrame(txCardScrollFrame);txCardScrollFrame=requestAnimationFrame(()=>updateTxCardCarouselVisual(false));clearTimeout(txCardCommitTimer);txCardCommitTimer=setTimeout(()=>updateTxCardCarouselVisual(true),95)};
}

function renderTxCategories(){
  const card=selectedTxCard(),select=document.getElementById('txCategory');if(!select)return;
  if(!card){select.innerHTML='<option value="">請先新增信用卡目標</option>';select.disabled=true;renderTxTargetPicks();return}
  select.disabled=false;
  const cats=[...new Set(card.targets.filter(t=>t.targetType==='rebate').flatMap(t=>Array.isArray(t.rebateCategories)?t.rebateCategories:[]).map(x=>String(x).trim()).filter(Boolean))];
  const options=cats.length?cats:['一般簽賬'];
  select.innerHTML=[...options.map(cat=>`<option value="${esc(cat)}">${esc(cat)}</option>`),'<option value="__other__">其他／不屬已設定類別</option>'].join('');
  renderTxTargetPicks();
}
function targetAutoMatches(t,category,date=localDateStr()){
  if(t.targetType==='welcome'){
    if(!t.approvalDate)return false;
    const end=addDays(t.approvalDate,Math.max(1,Number(t.welcomeDays||1)));
    return date>=t.approvalDate && date<=end;
  }
  if(t.rebateEndDate && date>t.rebateEndDate)return false;
  const cats=Array.isArray(t.rebateCategories)?t.rebateCategories.filter(Boolean):[];
  if(!cats.length)return category!=='__other__';
  return category!=='__other__' && cats.includes(category);
}
function renderTxTargetPicks(){
  const card=selectedTxCard(),box=document.getElementById('txTargetPicks'),summary=document.getElementById('txTargetSummary');if(!box||!summary)return;
  if(!card){box.innerHTML='';summary.className='tx-target-summary none';summary.textContent='';return}
  const category=document.getElementById('txCategory')?.value||'';
  const targets=card.targets;
  if(!targets.length){box.innerHTML='';summary.className='tx-target-summary none';summary.textContent='此信用卡暫時未有目標';return}
  let hit=0;
  box.innerHTML=targets.map(t=>{
    const active=targetAutoMatches(t,category);if(active)hit++;
    return `<div class="target-pick ${t.targetType==='welcome'?'welcome':''} ${active?'active':''}" data-target-id="${t.id}" role="button" tabindex="0" aria-pressed="${active?'true':'false'}">
      <span class="target-dot"></span><span class="target-copy"><strong>${esc(targetShortLabel(t))}</strong><small>${esc(targetDetailLabel(t))}</small></span>
    </div>`;
  }).join('');
  box.querySelectorAll('.target-pick').forEach(el=>{
    const toggle=()=>{el.classList.toggle('active');el.setAttribute('aria-pressed',el.classList.contains('active')?'true':'false');updateTxTargetSummary()};
    el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  });
  summary.className=`tx-target-summary ${hit?'hit':'none'}`;
  summary.textContent=hit?`系統自動命中 ${hit} 個目標；可按下個別目標亮起／熄滅`:'系統未自動命中目標；如需要仍可手動按下亮起';
}
function updateTxTargetSummary(){
  const box=document.getElementById('txTargetPicks'),summary=document.getElementById('txTargetSummary');if(!box||!summary)return;
  const n=box.querySelectorAll('.target-pick.active').length;summary.className=`tx-target-summary ${n?'hit':'none'}`;summary.textContent=n?`今次消費會計入 ${n} 個目標`:'今次消費不會計入任何目標';
}

document.getElementById('amountEntry')?.addEventListener('click',()=>document.getElementById('txAmount')?.focus());
document.getElementById('txAmount')?.addEventListener('input',e=>{
  let v=String(e.target.value||'').replace(/[^0-9.]/g,'');const dot=v.indexOf('.');if(dot>=0)v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,'').slice(0,2);v=v.replace(/^0+(?=\d)/,'');e.target.value=v;e.target.style.width=`${Math.min(10,Math.max(1,v.length||1))}ch`;
});
document.getElementById('txCard').addEventListener('change',renderTxCategories);
document.getElementById('txCategory').addEventListener('change',renderTxTargetPicks);
document.getElementById('confirmAdd').onclick=()=>{
  const card=selectedTxCard(),amount=parseFloat(document.getElementById('txAmount').value),raw=document.getElementById('txCategory').value;
  if(!card){alert('請先新增及選擇信用卡目標');return}
  if(!(amount>0)){alert('請輸入消費金額');return}
  const category=raw==='__other__'?'其他簽賬':raw;
  const selectedIds=[...document.querySelectorAll('#txTargetPicks .target-pick.active')].map(x=>x.dataset.targetId).filter(Boolean);
  const selectedTargets=selectedIds.map(id=>state.cards.find(t=>t.id===id)).filter(Boolean);
  const date=localDateStr();
  state.transactions.push({
    id:uid(),cardKey:card.cardKey,cardName:card.name,amount,category,targetIds:selectedIds,
    targetRefs:selectedTargets.map(t=>({id:t.id,type:t.targetType,label:targetShortLabel(t)})),date,createdAt:Date.now()
  });
  state.month=date.slice(0,7);save();render();closeModal('addModal');
};
document.getElementById('monthPicker').onchange=e=>{state.month=e.target.value||localMonthStr();save();render()};

let editingTargetId=null,creatingNewTarget=false;
const PRESET_CATEGORIES=['一般零售','網上簽賬','手機支付','感應式支付','海外簽賬','外幣簽賬','餐飲','超市','便利店','旅遊商戶','酒店','航空公司','交通','八達通','娛樂','指定商戶'];

document.getElementById('settingsBtn').onclick=()=>{
  const t=defaultTarget('rebate');t._temporary=true;state.cards.push(t);editingTargetId=t.id;creatingNewTarget=true;renderSettings();openModal('settingsModal');
};
function renderSettings(){
  const current=state.cards.find(t=>t.id===editingTargetId);document.getElementById('settingsCards').innerHTML=current?renderEditorTarget(current):'';
}
function cardNameChoices(){
  const existing=getPhysicalCards().map(c=>c.name);
  const suggestions=[...document.querySelectorAll('#cardNameSuggestions option')].map(o=>o.value).filter(Boolean);
  return [...new Set([...existing,...suggestions])];
}
function renderCardNamePicker(t){
  const options=cardNameChoices().map(name=>`<button class="card-name-option" type="button" onclick="chooseCardName(this,'${encodeURIComponent(name)}')">${esc(name)}</button>`).join('');
  return `<div class="field full card-name-picker"><label>信用卡名稱</label><div class="card-name-row">
    <input class="card-name-input" data-k="name" autocomplete="off" placeholder="輸入信用卡名稱" value="${esc(t.name)}">
    <button class="card-name-picker-btn" type="button" aria-label="選擇信用卡名稱" title="選擇信用卡名稱" onclick="toggleCardNameMenu(this)">⌄</button>
  </div><div class="card-name-menu hidden">${options}</div></div>`;
}
function renderEditorTarget(t){
  const selected=new Set(Array.isArray(t.rebateCategories)?t.rebateCategories:[]),custom=[...selected].filter(x=>!PRESET_CATEGORIES.includes(x));
  return `<div class="settings-editor"><div class="settings-card" data-id="${t.id}">
    <div class="settings-title"><h4>${creatingNewTarget?'新增目標':`修改目標 · ${esc(t.name)}`}</h4></div>
    <div class="grid2">${renderCardNamePicker(t)}</div>
    <div class="feature-label">目標類型</div><div class="feature-note">每次「新增目標」只建立一個目標；同一張信用卡如有多個優惠，請分開新增。</div>
    <div class="feature-picks">
      <button class="feature-pick ${t.targetType==='rebate'?'active':''}" type="button" onclick="setTargetType('${t.id}','rebate')"><span class="feature-icon">%</span>簽賬回贈</button>
      <button class="feature-pick welcome ${t.targetType==='welcome'?'active':''}" type="button" onclick="setTargetType('${t.id}','welcome')"><span class="feature-icon">★</span>迎新優惠</button>
    </div>
    <div class="offer-config ${t.targetType==='rebate'?'':'hidden'}" data-offer="rebate"><div class="offer-config-title">簽賬回贈設定</div><div class="grid2">
      <div class="field"><label>簽賬下限</label><input data-k="spendRequirement" type="number" min="0" value="${t.spendRequirement}"></div>
      <div class="field"><label>簽賬上限</label><input data-k="spendCap" type="number" min="0" value="${t.spendCap}"></div>
      <div class="field full"><label>簽賬回贈 %</label><input data-k="rebateRate" type="number" min="0" step="0.1" value="${t.rebateRate}"></div>
      <div class="field full"><label>簽賬類別 · 點按可亮起／取消</label><div class="category-preset-tags">
        ${PRESET_CATEGORIES.map(cat=>`<button class="cat-select ${selected.has(cat)?'active':''}" type="button" data-value="${esc(cat)}" onclick="togglePresetCategory(this)">${esc(cat)}</button>`).join('')}
      </div><div class="custom-category-caption">自定義類別</div><div class="category-input-row"><input class="category-new" autocomplete="off" placeholder="輸入自定義類別"><button class="category-add" type="button" onclick="addCategoryTag(this)">＋</button></div>
      <div class="custom-category-tags">${custom.map(cat=>`<button class="cat-chip" type="button" data-value="${esc(cat)}" onclick="this.remove()">${esc(cat)} <span>×</span></button>`).join('')}</div></div>
      <div class="field full"><label>優惠結束日期（可選）</label><input data-k="rebateEndDate" type="date" value="${t.rebateEndDate||''}"></div>
    </div></div>
    <div class="offer-config ${t.targetType==='welcome'?'':'hidden'}" data-offer="welcome"><div class="offer-config-title">迎新優惠設定</div><div class="grid2">
      <div class="field full"><label>批卡日期</label><input data-k="approvalDate" type="date" value="${t.approvalDate||''}"></div>
      <div class="field"><label>簽賬期限（日）</label><input data-k="welcomeDays" type="number" min="1" value="${t.welcomeDays}"></div>
      <div class="field"><label>簽賬要求</label><input data-k="welcomeRequirement" type="number" min="0" value="${t.welcomeRequirement}"></div>
      <div class="field"><label>獎賞類型</label><select data-k="welcomeRewardType"><option value="現金回贈" ${t.welcomeRewardType==='現金回贈'?'selected':''}>現金回贈</option><option value="飛行里數" ${t.welcomeRewardType==='飛行里數'?'selected':''}>飛行里數</option></select></div>
      <div class="field"><label>獎賞額</label><input data-k="welcomeReward" type="number" min="0" value="${t.welcomeReward}"></div>
    </div></div>
    <div class="save-row"><button class="save" onclick="saveTarget('${t.id}')">儲存</button>${creatingNewTarget?'':`<button class="remove" onclick="removeTarget('${t.id}')">刪除</button>`}</div>
  </div></div>`;
}
function syncEditorDraft(id){
  const panel=document.querySelector(`.settings-card[data-id="${id}"]`),t=state.cards.find(x=>x.id===id);if(!panel||!t)return;
  panel.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(el.type==='number')t[k]=Math.max(0,parseFloat(el.value)||0);else t[k]=el.value});
  const active=[...panel.querySelectorAll('.cat-select.active')].map(x=>x.dataset.value),custom=[...panel.querySelectorAll('.custom-category-tags .cat-chip')].map(x=>x.dataset.value);t.rebateCategories=[...new Set([...active,...custom].filter(Boolean))];
}
window.setTargetType=(id,type)=>{syncEditorDraft(id);const t=state.cards.find(x=>x.id===id);if(!t)return;t.targetType=type==='welcome'?'welcome':'rebate';renderSettings()};
window.toggleCardNameMenu=btn=>{const picker=btn.closest('.card-name-picker'),menu=picker?.querySelector('.card-name-menu');if(!menu)return;document.querySelectorAll('.card-name-menu').forEach(x=>{if(x!==menu)x.classList.add('hidden')});menu.classList.toggle('hidden')};
window.chooseCardName=(btn,encoded)=>{const picker=btn.closest('.card-name-picker'),input=picker?.querySelector('.card-name-input');if(!input)return;input.value=decodeURIComponent(encoded);picker.querySelector('.card-name-menu')?.classList.add('hidden');input.focus()};
window.togglePresetCategory=btn=>btn.classList.toggle('active');
window.addCategoryTag=btn=>{
  const panel=btn.closest('.settings-card'),input=panel?.querySelector('.category-new');if(!input)return;const value=input.value.trim();if(!value)return;
  const preset=[...panel.querySelectorAll('.cat-select')].find(x=>x.dataset.value===value);if(preset){preset.classList.add('active');input.value='';input.focus();return}
  const tags=panel.querySelector('.custom-category-tags'),exists=[...tags.querySelectorAll('.cat-chip')].some(x=>x.dataset.value===value);
  if(!exists){const chip=document.createElement('button');chip.type='button';chip.className='cat-chip';chip.dataset.value=value;chip.innerHTML=`${esc(value)} <span>×</span>`;chip.onclick=()=>chip.remove();tags.appendChild(chip)}input.value='';input.focus();
};
function resolveCardKeyForTarget(t,name){
  const norm=normalizeCardName(name);
  const sameName=state.cards.find(x=>!x._temporary&&x.id!==t.id&&normalizeCardName(x.name)===norm);
  if(sameName)return sameName.cardKey;
  const siblings=state.cards.filter(x=>!x._temporary&&x.id!==t.id&&x.cardKey===t.cardKey);
  if(!t.cardKey)return uid();
  if(siblings.length && siblings.some(x=>normalizeCardName(x.name)!==norm))return uid();
  return t.cardKey;
}
window.saveTarget=id=>{
  syncEditorDraft(id);const t=state.cards.find(x=>x.id===id);if(!t)return;t.name=t.name.trim();
  if(!t.name){alert('請輸入或選擇信用卡名稱');document.querySelector('.card-name-input')?.focus();return}
  t.cardKey=resolveCardKeyForTarget(t,t.name);delete t._temporary;save();creatingNewTarget=false;editingTargetId=null;render();renderSettings();closeModal('settingsModal');
};
window.removeTarget=id=>{
  const t=state.cards.find(x=>x.id===id);if(!t)return;if(!confirm(`刪除「${t.name}」的這個目標？消費紀錄會保留。`))return;
  state.cards=state.cards.filter(x=>x.id!==id);
  state.transactions.forEach(tx=>{tx.targetIds=(tx.targetIds||[]).filter(x=>x!==id);tx.targetRefs=(tx.targetRefs||[]).filter(x=>x.id!==id)});
  save();editingTargetId=null;creatingNewTarget=false;render();renderSettings();closeModal('settingsModal');
};
document.addEventListener('click',e=>{if(!e.target.closest('.card-name-picker'))document.querySelectorAll('.card-name-menu').forEach(x=>x.classList.add('hidden'))});
window.addEventListener('scroll',()=>document.querySelector('.top')?.classList.toggle('is-scrolled',window.scrollY>6),{passive:true});
render();
</script>
