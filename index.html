<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<title>信用卡優惠額度</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:rgba(255,255,255,.94);
  --text:#17191d;
  --muted:#7a8089;
  --line:#e7e9ed;
  --soft:#f1f3f5;
  --good:#137a56;
  --bad:#bf4545;
  --shadow:0 10px 30px rgba(20,26,34,.055);
  --shadow-strong:0 16px 42px rgba(20,26,34,.10);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{
  margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
body{
  background:
    radial-gradient(circle at 15% -10%, rgba(93,135,255,.10), transparent 30%),
    radial-gradient(circle at 100% 0%, rgba(91,210,164,.08), transparent 28%),
    var(--bg);
  min-height:100vh;
}
body{padding-bottom:96px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;padding:18px 14px 30px}

.top{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 -14px 16px;padding:12px 14px 11px;
  background:rgba(244,246,248,.88);
  border-bottom:1px solid rgba(226,229,234,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:box-shadow .2s ease,background .2s ease;
}
.top.is-scrolled{
  background:rgba(250,251,252,.96);
  box-shadow:0 7px 22px rgba(20,26,34,.07);
}
.title{
  font-size:23px;font-weight:850;letter-spacing:-.45px;
  background:linear-gradient(135deg,#15171a,#444b55);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.top-actions{display:flex;gap:7px;align-items:center}
.month{
  width:120px;border:0;background:transparent;color:var(--muted);
  font-weight:700;padding:7px 0
}
.icon-btn{
  width:39px;height:39px;border:1px solid rgba(224,227,232,.95);border-radius:12px;
  background:rgba(255,255,255,.88);display:grid;place-items:center;font-size:18px;
  box-shadow:0 5px 16px rgba(20,26,34,.05);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.icon-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(20,26,34,.08);background:#fff}
.icon-btn:active{transform:translateY(0) scale(.98)}

.new-target-btn{
  border:1px solid rgba(221,224,229,.95);
  border-radius:12px;background:rgba(255,255,255,.9);
  color:var(--text);padding:9px 12px;font-size:12px;font-weight:850;
  box-shadow:0 5px 16px rgba(20,26,34,.05);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.new-target-btn:hover{
  transform:translateY(-1px);background:#fff;
  box-shadow:0 8px 20px rgba(20,26,34,.08)
}
.new-target-btn:active{transform:translateY(0) scale(.97)}

.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin:0 2px 8px
}
.section-head h2{font-size:16px;margin:0;font-weight:850;letter-spacing:-.18px}
.section-head span{font-size:11px;color:var(--muted);font-weight:650}

.goals{
  background:var(--card);
  border:1px solid rgba(226,229,234,.92);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.goal{
  position:relative;
  padding:14px 14px 13px;
  border-bottom:1px solid rgba(231,233,237,.95);
  transition:background .18s ease;
}
.goal:last-child{border-bottom:0}
.goal:hover{background:rgba(248,249,251,.72)}
.goal::before{
  content:"";
  position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--bar-start,#5967ff),var(--bar-end,#8d73ff));
  opacity:.9;
}
.goal-card{
  font-size:11px;color:var(--muted);font-weight:760;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em
}
.goal-title{
  font-size:14.5px;font-weight:850;line-height:1.35;margin-bottom:5px;letter-spacing:-.1px
}
.goal-meta{
  font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:9px
}
.goal-progress-row{
  display:flex;align-items:center;gap:9px
}
.progress{
  position:relative;flex:1;height:8px;
  background:rgba(225,228,233,.88);
  border-radius:999px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(18,23,29,.06);
}
.progress>div{
  height:100%;
  width:var(--target-width,0%);
  background:linear-gradient(90deg,var(--bar-start,#5967ff),var(--bar-end,#8d73ff));
  border-radius:999px;
  box-shadow:0 0 12px var(--bar-glow,rgba(89,103,255,.22));
  transform-origin:left center;
  animation:progressGrow .82s cubic-bezier(.22,.78,.24,1) both;
  animation-delay:var(--bar-delay,0ms);
}
.progress>div::after{
  content:"";
  display:block;width:28%;height:100%;margin-left:auto;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
@keyframes progressGrow{
  from{transform:scaleX(0);opacity:.55}
  to{transform:scaleX(1);opacity:1}
}
.goal-percent{
  flex:0 0 auto;min-width:38px;text-align:right;font-size:12px;font-weight:850;
  color:var(--bar-start,#4f5fff)
}
.goal-status{
  margin-top:6px;font-size:11px;color:var(--muted);line-height:1.4
}
.goal-status b{color:var(--text)}
.goal-days{
  display:inline-flex;align-items:center;margin-left:6px;font-size:10px;font-weight:780;
  padding:2px 7px;border-radius:999px;background:rgba(241,243,245,.95);
  vertical-align:1px;border:1px solid rgba(228,230,234,.8)
}
.goal-days.good{color:var(--good);background:rgba(19,122,86,.08);border-color:rgba(19,122,86,.10)}
.goal-days.bad{color:var(--bad);background:rgba(191,69,69,.08);border-color:rgba(191,69,69,.10)}

.goal{
  cursor:pointer;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  column-gap:10px;
}
.goal-body{min-width:0}
.goal-modify{
  align-self:center;
  width:0;opacity:0;overflow:hidden;pointer-events:none;
  transform:translateX(16px) scale(.86);
  border:0;border-radius:10px;background:#17191d;color:#fff;
  padding:0;font-size:11px;font-weight:850;
  transition:
    width .23s cubic-bezier(.22,.8,.2,1),
    opacity .17s ease,
    transform .23s cubic-bezier(.22,.8,.2,1),
    padding .23s ease;
  position:relative;z-index:3
}
.goal.open .goal-modify{
  width:54px;opacity:1;pointer-events:auto;
  transform:translateX(0) scale(1);padding:8px 0
}
.goal.completed .goal-modify{
  background:rgba(103,72,8,.88)
}
.history-head{margin-top:20px}
.tx-list{
  background:var(--card);border:1px solid rgba(226,229,234,.92);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.tx{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  padding:12px 13px;border-bottom:1px solid var(--line);
  transition:background .16s ease
}
.tx:hover{background:rgba(248,249,251,.72)}
.tx:last-child{border-bottom:0}
.tx-card{font-size:13px;font-weight:750}
.tx-sub{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  margin-top:3px;font-size:10.5px;color:var(--muted)
}
.pill{background:var(--soft);padding:2px 6px;border-radius:999px}
.tx-amount{align-self:center;font-size:14px;font-weight:800}

.tx{
  position:relative;overflow:hidden;cursor:pointer;
  grid-template-columns:1fr auto auto;
  align-items:center;
}
.tx-content{
  min-width:0;
  transition:transform .24s cubic-bezier(.22,.8,.2,1),opacity .2s ease
}
.tx-amount{
  transition:transform .24s cubic-bezier(.22,.8,.2,1)
}
.tx-delete{
  width:0;opacity:0;transform:translateX(16px) scale(.82);
  overflow:hidden;border:0;border-radius:10px;
  background:#fff0f0;color:var(--bad);font-size:18px;font-weight:800;
  padding:0;pointer-events:none;
  transition:
    width .24s cubic-bezier(.22,.8,.2,1),
    opacity .18s ease,
    transform .24s cubic-bezier(.22,.8,.2,1),
    padding .24s ease;
}
.tx.open .tx-delete{
  width:38px;opacity:1;transform:translateX(0) scale(1);
  padding:8px 0;pointer-events:auto
}
.tx.open .tx-amount{transform:translateX(-2px)}
.tx.deleting{
  animation:txDelete .3s cubic-bezier(.4,0,.2,1) forwards
}
@keyframes txDelete{
  to{opacity:0;transform:translateX(28px) scale(.97);max-height:0;padding-top:0;padding-bottom:0}
}
.empty{
  padding:30px 14px;text-align:center;color:var(--muted);font-size:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(247,248,250,.55))
}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(244,246,248,0),rgba(244,246,248,.88) 28%,rgba(244,246,248,.98) 62%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.add-btn{
  display:block;width:min(692px,100%);margin:0 auto;border:0;border-radius:16px;
  background:linear-gradient(135deg,#15171a,#2d3239);
  color:#fff;padding:14px 16px;font-size:15px;font-weight:850;
  box-shadow:0 12px 28px rgba(20,24,30,.18);
  transition:transform .16s ease, box-shadow .16s ease, filter .16s ease
}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 15px 34px rgba(20,24,30,.22);filter:brightness(1.04)}
.add-btn:active{transform:translateY(0) scale(.99)}

.modal{
  position:fixed;inset:0;z-index:50;background:rgba(22,25,29,.34);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)
}
.modal.show{display:flex}
.modal.closing .sheet{animation:sheetDown .2s ease both}
.modal.closing{animation:backdropOut .2s ease both}
@keyframes sheetDown{to{transform:translateY(18px);opacity:0}}
@keyframes backdropOut{to{background:rgba(22,25,29,0);backdrop-filter:blur(0)}}
.sheet{
  width:min(720px,100%);max-height:90vh;overflow:auto;
  background:rgba(255,255,255,.98);
  border-radius:24px 24px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 50px rgba(17,22,29,.18);
  animation:sheetUp .24s cubic-bezier(.22,.8,.2,1) both;
}
@keyframes sheetUp{
  from{transform:translateY(18px);opacity:.5}
  to{transform:translateY(0);opacity:1}
}
.sheet-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 -14px 14px;padding:0 14px 12px;
}
#settingsModal .sheet-head{
  position:sticky;top:-16px;z-index:10;
  background:rgba(255,255,255,.96);
  padding-top:16px;
  border-bottom:1px solid rgba(228,230,234,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sheet-head h3{font-size:17px;margin:0}
.close{
  width:35px;height:35px;border:0;border-radius:50%;
  background:var(--soft);font-size:19px;color:#4f555d;
  transition:transform .14s ease, background .14s ease
}
.close:hover{background:#e8eaee;transform:rotate(4deg)}
.close:active{transform:scale(.96)}

.field{margin-bottom:11px}
.field label{
  display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px
}
input,select{
  width:100%;border:1px solid var(--line);border-radius:12px;
  background:#fff;padding:11px 10px;outline:none;color:var(--text);
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease
}
input:focus,select:focus{
  border-color:#aeb5bf;
  box-shadow:0 0 0 3px rgba(95,111,255,.08);
  background:#fff
}
.confirm{
  width:100%;border:0;border-radius:13px;
  background:linear-gradient(135deg,#15171a,#2f343b);
  color:#fff;padding:13px;font-weight:850;
  box-shadow:0 9px 22px rgba(18,22,28,.14);
  transition:transform .15s ease, box-shadow .15s ease
}
.confirm:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(18,22,28,.18)}
.confirm:active{transform:translateY(0) scale(.99)}


.offer-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:#eef0f3;padding:4px;border-radius:13px;margin-bottom:12px
}
.offer-tab{
  border:0;background:transparent;border-radius:10px;padding:9px 8px;
  font-size:12px;font-weight:820;color:var(--muted);
  transition:background .15s ease,color .15s ease,box-shadow .15s ease
}
.offer-tab.active{
  background:#fff;color:var(--text);
  box-shadow:0 3px 10px rgba(20,26,34,.07)
}
.offer-panel.hidden{display:none}

.settings-editor.hidden{display:none!important}
.settings-card{
  border:1px solid rgba(226,229,234,.95);border-radius:16px;
  padding:13px;margin-bottom:10px;background:#fff;
  box-shadow:0 6px 18px rgba(20,26,34,.04)
}
.settings-title{
  display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px
}
.settings-title h4{margin:0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{grid-column:1/-1}
.subhead{
  font-size:11px;font-weight:800;color:var(--muted);
  margin:4px 0 8px;padding-top:9px;border-top:1px solid var(--line)
}
.toggle-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0 3px
}
.toggle-row span{font-size:12px;font-weight:750}
.switch{
  position:relative;width:44px;height:26px;background:#d9dce1;border-radius:999px;cursor:pointer
}
.switch input{display:none}
.switch i{
  position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;
  box-shadow:0 1px 4px rgba(0,0,0,.18);transition:.16s
}
.switch input:checked + i{left:21px}
.switch:has(input:checked){background:#111}
.welcome-fields.hidden{display:none}
.save-row{display:flex;gap:8px;margin-top:8px}
.save-row button{
  flex:1;border:0;border-radius:11px;padding:10px;font-size:12px;font-weight:750
}
.save{background:linear-gradient(135deg,#17191d,#30353c);color:#fff}
.remove{background:#fff1f1;color:var(--bad)}
.add-card{
  width:100%;border:1px dashed #cfd2d7;border-radius:13px;background:#fafafa;
  padding:11px;font-weight:750
}
.tiny{font-size:10.5px;color:var(--muted);line-height:1.4}

@media(max-width:460px){
  .grid2{grid-template-columns:1fr 1fr}
}


/* 簽賬類別標籤 */
.category-input-row{display:grid;grid-template-columns:1fr 42px;gap:7px}
.category-add{
  border:0;border-radius:11px;background:var(--soft);font-weight:900;font-size:18px;
  color:#4f5660;transition:transform .15s ease,background .15s ease
}
.category-add:hover{background:#e8ebef;transform:translateY(-1px)}
.category-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cat-chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid #e1e4e9;
  border-radius:999px;background:#f6f7f9;padding:5px 8px;font-size:10.5px;
  font-weight:760;color:#4f5660
}
.cat-chip span{font-size:13px;color:#9298a1;line-height:1}

/* 新增消費：計入目標 */
.target-label{font-size:11px;color:var(--muted);font-weight:700;margin:2px 0 6px}
.target-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.target-pick{
  position:relative;display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:12px;background:#fff;
  padding:10px 11px;cursor:pointer;user-select:none;
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease
}
.target-pick input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.target-dot{
  width:18px;height:18px;border-radius:6px;border:1.5px solid #c9cdd4;
  display:grid;place-items:center;flex:0 0 auto;font-size:12px;color:white;
  transition:.15s ease
}
.target-pick strong{font-size:11.5px}
.target-pick small{display:block;color:var(--muted);font-size:9.5px;margin-top:1px}
.target-pick:has(input:checked){
  border-color:rgba(70,85,230,.24);background:rgba(88,103,255,.055);
  box-shadow:0 3px 12px rgba(50,62,160,.05)
}
.target-pick:has(input:checked) .target-dot{
  border-color:#5967ff;background:#5967ff
}
.target-pick:has(input:checked) .target-dot::after{content:"✓"}
.target-pick.welcome:has(input:checked){
  border-color:rgba(194,132,27,.25);background:rgba(245,182,54,.07)
}
.target-pick.welcome:has(input:checked) .target-dot{
  border-color:#c98b24;background:#c98b24
}

/* 達標慶祝：白色由左掃成金色 */
.goal > *{position:relative;z-index:2}
.goal.completed{overflow:hidden}
.goal.completed::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(105deg,rgba(255,255,255,.05),rgba(255,239,182,.86) 55%,rgba(250,219,113,.66));
  transform:scaleX(0);transform-origin:left center;
  animation:goldSweep .9s cubic-bezier(.2,.76,.22,1) .18s forwards
}
@keyframes goldSweep{
  0%{transform:scaleX(0)}
  100%{transform:scaleX(1)}
}
.trophy{
  display:inline-block;margin-left:5px;font-size:15px;vertical-align:-1px;
  opacity:0;transform:scale(.35) rotate(-12deg);
  animation:trophyPop .48s cubic-bezier(.2,1.35,.35,1) 1.02s forwards
}
@keyframes trophyPop{
  to{opacity:1;transform:scale(1) rotate(0)}
}
.goal.completed .goal-card,
.goal.completed .goal-meta,
.goal.completed .goal-status{color:#76601e}
.goal.completed .goal-percent{color:#8a6410}
.goal.completed .goal-days.good{
  color:#76550d;background:rgba(255,255,255,.48);border-color:rgba(139,101,16,.12)
}
.tx-target{
  display:inline-flex;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800;
  background:#eef0ff;color:#5967c8
}
.tx-target.welcome{background:#fff4d7;color:#9b6a12}


button,label.switch,.offer-tab,.cat-chip,.target-pick,.tx{
  -webkit-tap-highlight-color:transparent
}
.offer-panel{
  animation:panelFade .22s ease both
}
@keyframes panelFade{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

.existing-list{
  display:grid;gap:8px;margin-bottom:12px
}
.existing-card{
  position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;
  align-items:center;overflow:hidden;
  border:1px solid rgba(226,229,234,.95);border-radius:14px;
  background:#fff;padding:11px 12px;cursor:pointer;
  box-shadow:0 5px 16px rgba(20,26,34,.035);
  transition:background .16s ease,transform .16s ease
}
.existing-card:hover{background:#fafbfc}
.existing-card:active{transform:scale(.995)}
.existing-card-main{min-width:0}
.existing-card-name{
  font-size:13px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.existing-card-sub{
  margin-top:3px;font-size:10.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.modify-btn{
  width:0;opacity:0;overflow:hidden;pointer-events:none;
  transform:translateX(14px) scale(.88);
  border:0;border-radius:10px;background:#111;color:#fff;
  padding:0;font-size:11px;font-weight:820;
  transition:width .22s cubic-bezier(.22,.8,.2,1),
             opacity .16s ease,
             transform .22s cubic-bezier(.22,.8,.2,1),
             padding .22s ease
}
.existing-card.open .modify-btn{
  width:54px;opacity:1;pointer-events:auto;
  transform:translateX(0) scale(1);padding:8px 0
}
.settings-editor.hidden{display:none!important}
.settings-card{
  animation:cardIn .28s cubic-bezier(.22,.8,.2,1) both
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.tx{
  animation:txIn .28s cubic-bezier(.22,.8,.2,1) both
}
@keyframes txIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;

<script>
const KEY='cc_compact_goals_v3';

function uid(){
  return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random());
}
function localDateStr(){
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}
function localMonthStr(){return localDateStr().slice(0,7)}
function defaultCard(){
  return {
    id:uid(),
    name:'示例信用卡',
    rebateRate:4,
    spendRequirement:1500,
    spendCap:5556,
    rebateCategories:[],
    rebateEndDate:'',
    hasWelcome:true,
    approvalDate:'',
    welcomeDays:90,
    welcomeRequirement:12000,
    welcomeRewardType:'現金回贈',
    welcomeReward:1000
  };
}
function migrateCard(c){
  return {
    id:c.id || uid(),
    name:c.name || '未命名信用卡',
    rebateRate:
      c.rebateRate ?? (Number(c.baseRate||0)+Number(c.bonusRate||0)) ?? 0,
    spendRequirement:
      c.spendRequirement ?? c.monthlyThreshold ?? 0,
    spendCap:
      c.spendCap ?? c.bonusSpendCap ?? 0,
    rebateCategories:Array.isArray(c.rebateCategories) && c.rebateCategories.length
      ? c.rebateCategories
      : (c.selectedCategory ? [c.selectedCategory] : []),
    rebateEndDate:c.rebateEndDate || '',
    hasWelcome:
      c.hasWelcome ?? !!(c.approvalDate || c.welcomeSpend || c.welcomeRequirement),
    approvalDate:c.approvalDate || '',
    welcomeDays:c.welcomeDays ?? 90,
    welcomeRequirement:
      c.welcomeRequirement ?? c.welcomeSpend ?? 0,
    welcomeRewardType:c.welcomeRewardType || '現金回贈',
    welcomeReward:
      c.welcomeReward ?? c.welcomeCashback ?? 0
  };
}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x && Array.isArray(x.cards) && x.cards.length){
      x.cards=x.cards.map(migrateCard);
      x.transactions ||= [];
      x.transactions=x.transactions.map(t=>({
        ...t,
        qualifiesRebate:t.qualifiesRebate ?? true,
        qualifiesWelcome:t.qualifiesWelcome ?? true
      }));
      x.month ||= localMonthStr();
      return x;
    }

    // migrate older versions if found
    for(const oldKey of ['cc_simple_rebate_v2','cc_rebate_calculator_v1']){
      const old=JSON.parse(localStorage.getItem(oldKey));
      if(old && Array.isArray(old.cards) && old.cards.length){
        return {
          cards:old.cards.map(migrateCard),
          transactions:(Array.isArray(old.transactions)?old.transactions:[]).map(t=>({
            ...t,
            qualifiesRebate:t.qualifiesRebate ?? true,
            qualifiesWelcome:t.qualifiesWelcome ?? true
          })),
          month:old.month || old.selectedMonth || localMonthStr()
        };
      }
    }
  }catch(e){}
  return {cards:[defaultCard()],transactions:[],month:localMonthStr()};
}

let state=load();

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}
function money(n){
  return '$'+Number(n||0).toLocaleString('en-HK',{
    minimumFractionDigits:0,maximumFractionDigits:2
  });
}
function pct(a,b){
  return b ? Math.min(100,Math.max(0,Number(a)/Number(b)*100)) : 0;
}
function getMonthTx(cardId){
  return state.transactions.filter(t=>
    t.cardId===cardId && String(t.date).slice(0,7)===state.month
  );
}
function addDays(dateStr,days){
  const d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+Number(days)-1);
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}
function daysLeft(endStr){
  const a=new Date(localDateStr()+'T00:00:00');
  const b=new Date(endStr+'T00:00:00');
  return Math.max(0,Math.ceil((b-a)/86400000)+1);
}
function monthEnd(month){
  const [y,m]=month.split('-').map(Number);
  const d=new Date(y,m,0);
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}
function currentMonthSpend(cardId){
  return getMonthTx(cardId).reduce((s,t)=>s+Number(t.amount),0);
}
function rebateMonthSpend(card){
  return getMonthTx(card.id)
    .filter(t=>t.qualifiesRebate !== false)
    .filter(t=>!card.rebateEndDate || t.date<=card.rebateEndDate)
    .reduce((s,t)=>s+Number(t.amount),0);
}
function rewardLabel(card){
  if(card.welcomeRewardType==='飛行里數'){
    return `${Number(card.welcomeReward||0).toLocaleString('en-HK')} 里`;
  }
  return money(card.welcomeReward);
}

function getGoalRows(){
  const rows=[];
  const today=localDateStr();
  const currentMonth=localMonthStr();

  state.cards.filter(c=>!c._temporary).forEach(c=>{
    const spent=rebateMonthSpend(c);
    const cap=Number(c.spendCap||0);
    const req=Number(c.spendRequirement||0);
    const monthlyEnd=monthEnd(state.month);
    let end=monthlyEnd;

    // If the rebate offer has an explicit end date, use the earlier of
    // the selected month's end and the offer end date.
    if(c.rebateEndDate && c.rebateEndDate < end){
      end=c.rebateEndDate;
    }

    let remainDays=0;
    let ended=false;
    const selectedMonthStart=state.month+'-01';
    if(c.rebateEndDate && selectedMonthStart>c.rebateEndDate){
      ended=true;
    }else if(state.month<currentMonth){
      ended=true;
    }else if(c.rebateEndDate && today>c.rebateEndDate){
      ended=true;
    }else{
      remainDays=daysLeft(end);
    }

    let progressTarget=cap>0?cap:req;
    let progress=pct(spent,progressTarget);
    let status='';

    if(spent<req){
      status=`已簽 ${money(spent)}，尚欠 ${money(req-spent)} 進入門檻`;
    }else if(cap>0 && spent<cap){
      status=`已簽 ${money(spent)}，尚餘 ${money(cap-spent)} 消費額`;
    }else if(cap>0 && spent>=cap){
      status=`已簽 ${money(spent)}，已用盡本期額度`;
    }else{
      status=`已簽 ${money(spent)}，已達簽賬要求`;
    }

    rows.push({
      cardId:c.id,
      goalType:'rebate',
      card:c.name,
      title:`簽賬回贈 · ${Number(c.rebateRate||0).toFixed(
        Number.isInteger(Number(c.rebateRate||0))?0:1
      )}%`,
      meta:`下限 ${money(req)} · 上限 ${cap>0?money(cap):'—'}${c.rebateEndDate?` · 至 ${c.rebateEndDate}`:' · 每月重置'}`,
      days:ended?'已完結':`${remainDays}日`,
      dayClass:ended?'bad':(cap>0 && spent>=cap?'good':''),
      progress,
      percent:`${Math.round(progress)}%`,
      status,
      completed:progressTarget>0 && spent>=progressTarget
    });

    if(c.hasWelcome){
      const reqW=Number(c.welcomeRequirement||0);
      let accum=0;
      let endStr='';
      let daysText='未設定日期';
      let dayClass='';
      let progressW=0;
      let statusW='';

      if(c.approvalDate){
        endStr=addDays(c.approvalDate,Math.max(1,Number(c.welcomeDays||1)));
        accum=state.transactions
          .filter(t=>
            t.cardId===c.id &&
            t.qualifiesWelcome !== false &&
            t.date>=c.approvalDate &&
            t.date<=endStr
          )
          .reduce((sum,t)=>sum+Number(t.amount),0);

        progressW=pct(accum,reqW);

        if(reqW>0 && accum>=reqW){
          daysText='已完成';
          dayClass='good';
          statusW=`已簽 ${money(accum)}，已達迎新要求`;
        }else if(today>endStr){
          daysText='已完結';
          dayClass='bad';
          statusW=`已簽 ${money(accum)}，尚欠 ${money(Math.max(0,reqW-accum))}`;
        }else{
          daysText=`${daysLeft(endStr)}日`;
          statusW=`已簽 ${money(accum)}，尚欠 ${money(Math.max(0,reqW-accum))} 簽賬要求`;
        }
      }else{
        statusW=`尚未設定批卡日期`;
      }

      rows.push({
        cardId:c.id,
        goalType:'welcome',
        card:c.name,
        title:`迎新簽賬 · ${esc(c.welcomeRewardType)} ${rewardLabel(c)}`,
        meta:`要求 ${money(reqW)}`,
        days:daysText,
        dayClass,
        progress:progressW,
        percent:`${Math.round(progressW)}%`,
        status:statusW,
        completed:reqW>0 && accum>=reqW
      });
    }
  });

  return rows;
}

const goalPalettes=[
  ['#5967ff','#8c72ff','rgba(89,103,255,.25)'],
  ['#0f9f78','#42c99c','rgba(15,159,120,.22)'],
  ['#f08a24','#f6b44a','rgba(240,138,36,.22)'],
  ['#d4528f','#ef7daf','rgba(212,82,143,.22)'],
  ['#3f8fd8','#63b2ef','rgba(63,143,216,.22)'],
  ['#7b61c9','#ae8bea','rgba(123,97,201,.22)'],
  ['#cf5f4b','#ef8a6d','rgba(207,95,75,.22)'],
  ['#3d8b7d','#6bb8a9','rgba(61,139,125,.22)']
];
function goalPalette(i){
  return goalPalettes[i % goalPalettes.length];
}

function renderGoals(){
  const rows=getGoalRows();
  document.getElementById('goalCount').textContent=`${rows.length} 個目標`;

  const box=document.getElementById('goals');
  if(!rows.length){
    box.innerHTML='<div class="empty">未設定任何目標</div>';
    return;
  }

  box.innerHTML=rows.map((r,i)=>{
    const [barStart,barEnd,barGlow]=goalPalette(i);
    const delay=Math.min(i*70,420);
    return `
    <div class="goal ${r.completed?'completed':''}" data-card-id="${r.cardId}" data-goal-type="${r.goalType}" style="--bar-start:${barStart};--bar-end:${barEnd};--bar-glow:${barGlow};--bar-delay:${delay}ms">
      <div class="goal-body">
        <div class="goal-card">${esc(r.card)}</div>
        <div class="goal-title">
          ${r.title}${r.completed?'<span class="trophy" title="目標達成">🏆</span>':''}
          <span class="goal-days ${r.dayClass}">${esc(r.days)}</span>
        </div>
        <div class="goal-meta">${r.meta}</div>
        <div class="goal-progress-row">
          <div class="progress"><div style="--target-width:${r.progress}%"></div></div>
          <div class="goal-percent">${r.percent}</div>
        </div>
        <div class="goal-status">${r.status}</div>
      </div>
      <button class="goal-modify" type="button">修改</button>
    </div>
  `}).join('');

  bindGoalActions();
}

function bindGoalActions(){
  document.querySelectorAll('.goal').forEach(row=>{
    const modify=row.querySelector('.goal-modify');

    row.addEventListener('click',e=>{
      if(e.target.closest('.goal-modify'))return;
      const wasOpen=row.classList.contains('open');
      document.querySelectorAll('.goal.open').forEach(x=>x.classList.remove('open'));
      if(!wasOpen)requestAnimationFrame(()=>row.classList.add('open'));
    });

    modify?.addEventListener('click',e=>{
      e.stopPropagation();
      const cardId=row.dataset.cardId;
      const type=row.dataset.goalType || 'rebate';
      if(!cardId)return;

      editingCardId=cardId;
      creatingNewTarget=false;
      activeOfferTab=type;
      renderSettings();
      openModal('settingsModal');
    });
  });
}

function renderTransactions(){
  const tx=state.transactions
    .filter(t=>String(t.date).slice(0,7)===state.month)
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  document.getElementById('txCount').textContent=`${tx.length} 筆`;
  const box=document.getElementById('txList');

  if(!tx.length){
    box.innerHTML='<div class="empty">暫時未有消費紀錄</div>';
    return;
  }

  box.innerHTML=tx.map(t=>{
    const c=state.cards.find(c=>c.id===t.cardId);
    return `
      <div class="tx" data-id="${t.id}">
        <div class="tx-content">
          <div class="tx-card">${esc(c?.name||'已刪除信用卡')}</div>
          <div class="tx-sub">
            <span>${esc(t.date)}</span>
            <span class="pill">${esc(t.category||'一般簽賬')}</span>
            ${t.qualifiesRebate!==false?'<span class="tx-target">回贈</span>':''}
            ${t.qualifiesWelcome!==false?'<span class="tx-target welcome">迎新</span>':''}
          </div>
        </div>
        <div class="tx-amount">${money(t.amount)}</div>
        <button class="tx-delete" type="button" aria-label="刪除消費">×</button>
      </div>
    `;
  }).join('');

  bindTransactionActions();
}


function bindTransactionActions(){
  document.querySelectorAll('.tx').forEach(row=>{
    const del=row.querySelector('.tx-delete');

    row.addEventListener('click',e=>{
      if(e.target.closest('.tx-delete'))return;

      const wasOpen=row.classList.contains('open');
      document.querySelectorAll('.tx.open').forEach(x=>x.classList.remove('open'));
      if(!wasOpen){
        requestAnimationFrame(()=>row.classList.add('open'));
      }
    });

    del?.addEventListener('click',e=>{
      e.stopPropagation();
      const id=row.dataset.id;
      if(!id)return;

      row.classList.add('deleting');
      setTimeout(()=>{
        state.transactions=state.transactions.filter(t=>t.id!==id);
        save();
        render();
      },260);
    });
  });
}

function renderCardOptions(){
  document.getElementById('txCard').innerHTML=state.cards
    .filter(c=>!c._temporary)
    .map(c=>`<option value="${c.id}">${esc(c.name)}</option>`)
    .join('');
}

function selectedTxCard(){
  return state.cards.find(c=>c.id===document.getElementById('txCard').value) || state.cards[0];
}
function renderTxCategories(){
  const c=selectedTxCard();
  const select=document.getElementById('txCategory');
  if(!c || !select)return;

  const cats=[...(Array.isArray(c.rebateCategories)?c.rebateCategories:[])];
  const unique=[...new Set(cats.map(x=>String(x).trim()).filter(Boolean))];
  select.innerHTML=[
    ...unique.map(cat=>`<option value="${esc(cat)}">${esc(cat)}</option>`),
    '<option value="__other__">其他／不屬回贈類別</option>'
  ].join('');

  syncTxQualificationDefaults(true);
}
function syncTxQualificationDefaults(resetWelcome=false){
  const c=selectedTxCard();
  if(!c)return;

  const category=document.getElementById('txCategory').value;
  const rebateCats=Array.isArray(c.rebateCategories)?c.rebateCategories:[];
  const rebateBox=document.getElementById('txQualifyRebate');
  const welcomeBox=document.getElementById('txQualifyWelcome');
  const welcomePick=document.getElementById('welcomeTargetPick');

  rebateBox.checked=
    category!=='__other__' && rebateCats.includes(category);

  const hasWelcome=!!c.hasWelcome;
  welcomePick?.classList.toggle('hidden',!hasWelcome);

  if(!hasWelcome){
    welcomeBox.checked=false;
  }else if(resetWelcome){
    welcomeBox.checked=true;
  }
}

function render(){
  document.getElementById('monthPicker').value=state.month;
  renderGoals();
  renderTransactions();
  renderCardOptions();
}

function openModal(id){
  const el=document.getElementById(id);
  el.classList.remove('closing');
  el.classList.add('show');
}
function closeModal(id){
  const el=document.getElementById(id);
  if(!el.classList.contains('show'))return;

  if(id==='settingsModal' && creatingNewTarget && editingCardId){
    const unsavedId=editingCardId;
    state.cards=state.cards.filter(c=>c.id!==unsavedId);
    state.transactions=state.transactions.filter(t=>t.cardId!==unsavedId);
    creatingNewTarget=false;
    editingCardId=null;
  }

  el.classList.add('closing');
  setTimeout(()=>{
    el.classList.remove('show','closing');
  },190);
}

document.querySelectorAll('[data-close]').forEach(b=>{
  b.onclick=()=>closeModal(b.dataset.close);
});
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click',e=>{
    if(e.target===m) closeModal(m.id);
  });
});

document.getElementById('openAdd').onclick=()=>{
  renderCardOptions();
  document.getElementById('txAmount').value='';
  renderTxCategories();
  openModal('addModal');
  setTimeout(()=>document.getElementById('txAmount').focus(),100);
};

document.getElementById('txCard').addEventListener('change',renderTxCategories);
document.getElementById('txCategory').addEventListener('change',()=>syncTxQualificationDefaults(false));

document.getElementById('confirmAdd').onclick=()=>{
  const cardId=document.getElementById('txCard').value;
  const amount=parseFloat(document.getElementById('txAmount').value);
  const rawCategory=document.getElementById('txCategory').value;
  const category=rawCategory==='__other__'?'其他簽賬':rawCategory;
  const qualifiesRebate=document.getElementById('txQualifyRebate').checked;
  const qualifiesWelcome=document.getElementById('txQualifyWelcome').checked;

  if(!(amount>0)){
    alert('請輸入消費金額');
    return;
  }

  const date=localDateStr();
  state.transactions.push({
    id:uid(),
    cardId,
    amount,
    category,
    qualifiesRebate,
    qualifiesWelcome,
    date,
    createdAt:Date.now()
  });
  state.month=date.slice(0,7);
  save();
  render();
  closeModal('addModal');
};

document.getElementById('monthPicker').onchange=e=>{
  state.month=e.target.value||localMonthStr();
  save();
  render();
};

document.getElementById('settingsBtn').onclick=()=>{
  activeOfferTab='rebate';

  const c=defaultCard();
  c.name='';
  c.rebateCategories=[];
  c.hasWelcome=false;
  c.approvalDate='';
  c.rebateEndDate='';
  c._temporary=true;

  state.cards.push(c);
  editingCardId=c.id;
  creatingNewTarget=true;

  renderSettings();
  openModal('settingsModal');
};

let activeOfferTab='rebate';

function setOfferTab(tab){
  const changed=activeOfferTab!==tab;
  activeOfferTab=tab;

  if(changed && editingCardId){
    const c=state.cards.find(x=>x.id===editingCardId);
    if(creatingNewTarget && c && tab==='welcome'){
      c.hasWelcome=true;
    }
    renderSettings();
    return;
  }

  document.querySelectorAll('.offer-tab').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.tab===tab);
  });
}

let editingCardId=null;
let creatingNewTarget=false;

function cardSummary(c){
  if(activeOfferTab==='welcome'){
    if(!c.hasWelcome)return '未設定迎新優惠';
    return `迎新 · 要求 ${money(c.welcomeRequirement||0)} · ${c.welcomeRewardType||'現金回贈'} ${rewardLabel(c)}`;
  }
  const cats=(c.rebateCategories||[]).join('、') || '未設定類別';
  return `回贈 ${Number(c.rebateRate||0)}% · ${cats}`;
}

function openCardEditor(id){
  editingCardId=id;
  creatingNewTarget=false;
  renderSettings();
  setTimeout(()=>{
    document.querySelector('.settings-editor')?.scrollIntoView({behavior:'smooth',block:'start'});
  },30);
}

function renderSettings(){
  const current=state.cards.find(c=>c.id===editingCardId);

  document.getElementById('settingsCards').innerHTML=`
    <div class="offer-tabs">
      <button class="offer-tab ${activeOfferTab==='rebate'?'active':''}" data-tab="rebate" onclick="setOfferTab('rebate')">簽賬回贈</button>
      <button class="offer-tab ${activeOfferTab==='welcome'?'active':''}" data-tab="welcome" onclick="setOfferTab('welcome')">迎新優惠</button>
    </div>

    ${current ? renderEditorCard(current,activeOfferTab) : ''}
  `;

  setOfferTab(activeOfferTab);
}

function renderEditorCard(c,type){
  if(type==='welcome'){
    return `
      <div class="settings-editor">
        <div class="settings-card" data-id="${c.id}" data-type="welcome">
          <div class="settings-title"><h4>${creatingNewTarget?'新增迎新優惠':esc(c.name)}</h4></div>

          <div class="toggle-row" style="padding-top:0;margin-bottom:8px">
            <span>啟用迎新優惠</span>
            <label class="switch">
              <input type="checkbox" data-k="hasWelcome" ${c.hasWelcome?'checked':''}
                onchange="toggleWelcomePanel('${c.id}',this.checked)">
              <i></i>
            </label>
          </div>

          <div class="welcome-fields ${c.hasWelcome?'':'hidden'}">
            <div class="grid2">
              <div class="field full">
                <label>信用卡名稱</label>
                <input data-k="name" list="cardNameList" autocomplete="off" placeholder="輸入或選擇信用卡" value="${esc(c.name)}">
              </div>
              <div class="field full">
                <label>批卡日期</label>
                <input data-k="approvalDate" type="date" value="${c.approvalDate||''}">
              </div>
              <div class="field">
                <label>簽賬期限（日）</label>
                <input data-k="welcomeDays" type="number" min="1" value="${c.welcomeDays}">
              </div>
              <div class="field">
                <label>簽賬要求</label>
                <input data-k="welcomeRequirement" type="number" min="0" value="${c.welcomeRequirement}">
              </div>
              <div class="field">
                <label>獎賞類型</label>
                <select data-k="welcomeRewardType">
                  <option value="現金回贈" ${c.welcomeRewardType==='現金回贈'?'selected':''}>現金回贈</option>
                  <option value="飛行里數" ${c.welcomeRewardType==='飛行里數'?'selected':''}>飛行里數</option>
                </select>
              </div>
              <div class="field">
                <label>獎賞額</label>
                <input data-k="welcomeReward" type="number" min="0" value="${c.welcomeReward}">
              </div>
            </div>
          </div>

          <div class="save-row">
            <button class="save" onclick="saveOfferCard('${c.id}','welcome')">儲存</button>
            ${creatingNewTarget?'':`<button class="remove" onclick="removeCard('${c.id}')">刪除</button>`}
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="settings-editor">
      <div class="settings-card" data-id="${c.id}" data-type="rebate">
        <div class="settings-title"><h4>${creatingNewTarget?'新增簽賬回贈':esc(c.name)}</h4></div>
        <div class="grid2">
          <div class="field full">
            <label>信用卡名稱</label>
            <input data-k="name" list="cardNameList" autocomplete="off" placeholder="輸入或選擇信用卡" value="${esc(c.name)}">
          </div>
          <div class="field">
            <label>簽賬回贈 %</label>
            <input data-k="rebateRate" type="number" min="0" step="0.1" value="${c.rebateRate}">
          </div>
          <div class="field">
            <label>簽賬下限</label>
            <input data-k="spendRequirement" type="number" min="0" value="${c.spendRequirement}">
          </div>
          <div class="field">
            <label>簽賬上限</label>
            <input data-k="spendCap" type="number" min="0" value="${c.spendCap}">
          </div>
          <div class="field full">
            <label>簽賬類別</label>
            <div class="category-input-row">
              <input class="category-new" list="spendCategorySuggestions" autocomplete="off" placeholder="例如：網上簽賬">
              <button class="category-add" type="button" onclick="addCategoryTag(this)">＋</button>
            </div>
            <div class="category-tags">
              ${(c.rebateCategories||[]).map(cat=>`
                <button class="cat-chip" type="button" data-value="${esc(cat)}" onclick="this.remove()">
                  ${esc(cat)} <span>×</span>
                </button>
              `).join('')}
            </div>
          </div>
          <div class="field full">
            <label>優惠結束日期（可選）</label>
            <input data-k="rebateEndDate" type="date" value="${c.rebateEndDate||''}">
          </div>
        </div>

        <div class="save-row">
          <button class="save" onclick="saveOfferCard('${c.id}','rebate')">儲存</button>
          ${creatingNewTarget?'':`<button class="remove" onclick="removeCard('${c.id}')">刪除</button>`}
        </div>
      </div>
    </div>
  `;
}

window.toggleWelcomePanel=(id,checked)=>{
  const panel=[...document.querySelectorAll('.settings-card')]
    .find(x=>x.dataset.id===id && x.dataset.type==='welcome');
  if(panel){
    panel.querySelector('.welcome-fields').classList.toggle('hidden',!checked);
  }
};

window.addCategoryTag=btn=>{
  const panel=btn.closest('.settings-card');
  const input=panel?.querySelector('.category-new');
  const tags=panel?.querySelector('.category-tags');
  if(!input||!tags)return;
  const value=input.value.trim();
  if(!value)return;

  const exists=[...tags.querySelectorAll('.cat-chip')].some(x=>x.dataset.value===value);
  if(!exists){
    const chip=document.createElement('button');
    chip.type='button';
    chip.className='cat-chip';
    chip.dataset.value=value;
    chip.innerHTML=`${esc(value)} <span>×</span>`;
    chip.onclick=()=>chip.remove();
    tags.appendChild(chip);
  }
  input.value='';
  input.focus();
};

window.saveOfferCard=(id,type)=>{
  const panel=[...document.querySelectorAll('.settings-card')]
    .find(x=>x.dataset.id===id && x.dataset.type===type);
  const c=state.cards.find(x=>x.id===id);
  if(!panel||!c)return;

  panel.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;
    if(el.type==='checkbox'){
      c[k]=el.checked;
    }else if(el.type==='number'){
      c[k]=Math.max(0,parseFloat(el.value)||0);
    }else{
      c[k]=el.value;
    }
  });

  if(type==='rebate'){
    c.rebateCategories=[...panel.querySelectorAll('.category-tags .cat-chip')]
      .map(x=>x.dataset.value)
      .filter(Boolean);
  }

  c.name=c.name.trim()||'未命名信用卡';
  delete c._temporary;
  save();
  render();

  if(creatingNewTarget){
    creatingNewTarget=false;
  }
  editingCardId=null;
  renderSettings();
};

window.removeCard=id=>{
  if(state.cards.length<=1){
    alert('至少保留一張信用卡');
    return;
  }
  const c=state.cards.find(x=>x.id===id);
  if(!confirm(`刪除「${c.name}」及其消費紀錄？`))return;

  state.cards=state.cards.filter(x=>x.id!==id);
  state.transactions=state.transactions.filter(t=>t.cardId!==id);
  save();
  render();
  renderSettings();
};



window.addEventListener('scroll',()=>{
  document.querySelector('.top')?.classList.toggle('is-scrolled',window.scrollY>6);
},{passive:true});

render();
</script>
