<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<title>信用卡優惠額度</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:rgba(255,255,255,.94);
  --text:#17191d;
  --muted:#7a8089;
  --line:#e7e9ed;
  --soft:#f1f3f5;
  --good:#137a56;
  --bad:#bf4545;
  --shadow:0 10px 30px rgba(20,26,34,.055);
  --shadow-strong:0 16px 42px rgba(20,26,34,.10);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{
  margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
body{
  background:
    radial-gradient(circle at 15% -10%, rgba(93,135,255,.10), transparent 30%),
    radial-gradient(circle at 100% 0%, rgba(91,210,164,.08), transparent 28%),
    var(--bg);
  min-height:100vh;
}
body{padding-bottom:96px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;padding:18px 14px 30px}

.top{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 -14px 16px;padding:12px 14px 11px;
  background:rgba(244,246,248,.88);
  border-bottom:1px solid rgba(226,229,234,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:box-shadow .2s ease,background .2s ease;
}
.top.is-scrolled{
  background:rgba(250,251,252,.96);
  box-shadow:0 7px 22px rgba(20,26,34,.07);
}
.title{
  font-size:23px;font-weight:850;letter-spacing:-.45px;
  background:linear-gradient(135deg,#15171a,#444b55);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.top-actions{display:flex;gap:7px;align-items:center}
.month{
  width:120px;border:0;background:transparent;color:var(--muted);
  font-weight:700;padding:7px 0
}
.icon-btn{
  width:39px;height:39px;border:1px solid rgba(224,227,232,.95);border-radius:12px;
  background:rgba(255,255,255,.88);display:grid;place-items:center;font-size:18px;
  box-shadow:0 5px 16px rgba(20,26,34,.05);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.icon-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(20,26,34,.08);background:#fff}
.icon-btn:active{transform:translateY(0) scale(.98)}

.new-target-btn{
  border:1px solid rgba(221,224,229,.95);
  border-radius:12px;background:rgba(255,255,255,.9);
  color:var(--text);padding:9px 12px;font-size:12px;font-weight:850;
  box-shadow:0 5px 16px rgba(20,26,34,.05);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.new-target-btn:hover{
  transform:translateY(-1px);background:#fff;
  box-shadow:0 8px 20px rgba(20,26,34,.08)
}
.new-target-btn:active{transform:translateY(0) scale(.97)}

.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin:0 2px 8px
}
.section-head h2{font-size:16px;margin:0;font-weight:850;letter-spacing:-.18px}
.section-head span{font-size:11px;color:var(--muted);font-weight:650}

.goals{
  background:var(--card);
  border:1px solid rgba(226,229,234,.92);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.goal{
  position:relative;
  padding:14px 14px 13px;
  border-bottom:1px solid rgba(231,233,237,.95);
  transition:background .18s ease;
}
.goal:last-child{border-bottom:0}
.goal:hover{background:rgba(248,249,251,.72)}
.goal::before{
  content:"";
  position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--bar-start,#5967ff),var(--bar-end,#8d73ff));
  opacity:.9;
}
.goal-card{
  font-size:11px;color:var(--muted);font-weight:760;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em
}
.goal-title{
  font-size:14.5px;font-weight:850;line-height:1.35;margin-bottom:5px;letter-spacing:-.1px
}
.goal-meta{
  font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:9px
}
.goal-progress-row{
  display:flex;align-items:center;gap:9px
}
.progress{
  position:relative;flex:1;height:8px;
  background:rgba(225,228,233,.88);
  border-radius:999px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(18,23,29,.06);
}
.progress>div{
  height:100%;
  width:var(--target-width,0%);
  background:linear-gradient(90deg,var(--bar-start,#5967ff),var(--bar-end,#8d73ff));
  border-radius:999px;
  box-shadow:0 0 12px var(--bar-glow,rgba(89,103,255,.22));
  transform-origin:left center;
  animation:progressGrow .82s cubic-bezier(.22,.78,.24,1) both;
  animation-delay:var(--bar-delay,0ms);
}
.progress>div::after{
  content:"";
  display:block;width:28%;height:100%;margin-left:auto;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
@keyframes progressGrow{
  from{transform:scaleX(0);opacity:.55}
  to{transform:scaleX(1);opacity:1}
}
.goal-percent{
  flex:0 0 auto;min-width:38px;text-align:right;font-size:12px;font-weight:850;
  color:var(--bar-start,#4f5fff)
}
.goal-status{
  margin-top:6px;font-size:11px;color:var(--muted);line-height:1.4
}
.goal-status b{color:var(--text)}
.goal-days{
  display:inline-flex;align-items:center;margin-left:6px;font-size:10px;font-weight:780;
  padding:2px 7px;border-radius:999px;background:rgba(241,243,245,.95);
  vertical-align:1px;border:1px solid rgba(228,230,234,.8)
}
.goal-days.good{color:var(--good);background:rgba(19,122,86,.08);border-color:rgba(19,122,86,.10)}
.goal-days.bad{color:var(--bad);background:rgba(191,69,69,.08);border-color:rgba(191,69,69,.10)}

.goal{
  cursor:pointer;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  column-gap:10px;
}
.goal-body{min-width:0}
.goal-modify{
  align-self:center;
  width:0;opacity:0;overflow:hidden;pointer-events:none;
  transform:translateX(16px) scale(.86);
  border:0;border-radius:10px;background:#17191d;color:#fff;
  padding:0;font-size:11px;font-weight:850;
  transition:
    width .23s cubic-bezier(.22,.8,.2,1),
    opacity .17s ease,
    transform .23s cubic-bezier(.22,.8,.2,1),
    padding .23s ease;
  position:relative;z-index:3
}
.goal.open .goal-modify{
  width:54px;opacity:1;pointer-events:auto;
  transform:translateX(0) scale(1);padding:8px 0
}
.goal.completed .goal-modify{
  background:rgba(103,72,8,.88)
}
.history-head{margin-top:20px}
.tx-list{
  background:var(--card);border:1px solid rgba(226,229,234,.92);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.tx{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  padding:12px 13px;border-bottom:1px solid var(--line);
  transition:background .16s ease
}
.tx:hover{background:rgba(248,249,251,.72)}
.tx:last-child{border-bottom:0}
.tx-card{font-size:13px;font-weight:750}
.tx-sub{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  margin-top:3px;font-size:10.5px;color:var(--muted)
}
.pill{background:var(--soft);padding:2px 6px;border-radius:999px}
.tx-amount{align-self:center;font-size:14px;font-weight:800}

.tx{
  position:relative;overflow:hidden;cursor:pointer;
  grid-template-columns:1fr auto auto;
  align-items:center;
}
.tx-content{
  min-width:0;
  transition:transform .24s cubic-bezier(.22,.8,.2,1),opacity .2s ease
}
.tx-amount{
  transition:transform .24s cubic-bezier(.22,.8,.2,1)
}
.tx-edit{
  width:0;opacity:0;transform:translateX(16px) scale(.86);
  overflow:hidden;border:0;border-radius:10px;
  background:#eef0f3;color:#30343a;font-size:11px;font-weight:850;
  white-space:nowrap;padding:0;pointer-events:none;
  transition:
    width .24s cubic-bezier(.22,.8,.2,1),
    opacity .18s ease,
    transform .24s cubic-bezier(.22,.8,.2,1),
    padding .24s ease;
}
.tx.open .tx-edit{
  width:52px;opacity:1;transform:translateX(0) scale(1);
  padding:9px 0;pointer-events:auto
}
.tx-edit:hover{background:#e3e6ea}
.tx.open .tx-amount{transform:translateX(-2px)}
.tx.deleting{
  animation:txDelete .3s cubic-bezier(.4,0,.2,1) forwards
}
@keyframes txDelete{
  to{opacity:0;transform:translateX(28px) scale(.97);max-height:0;padding-top:0;padding-bottom:0}
}
.empty{
  padding:30px 14px;text-align:center;color:var(--muted);font-size:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(247,248,250,.55))
}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(244,246,248,0),rgba(244,246,248,.88) 28%,rgba(244,246,248,.98) 62%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.add-btn{
  display:block;width:min(692px,100%);margin:0 auto;border:0;border-radius:16px;
  background:linear-gradient(135deg,#15171a,#2d3239);
  color:#fff;padding:14px 16px;font-size:15px;font-weight:850;
  box-shadow:0 12px 28px rgba(20,24,30,.18);
  transition:transform .16s ease, box-shadow .16s ease, filter .16s ease
}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 15px 34px rgba(20,24,30,.22);filter:brightness(1.04)}
.add-btn:active{transform:translateY(0) scale(.99)}

.modal{
  position:fixed;inset:0;z-index:50;background:rgba(22,25,29,.34);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)
}
.modal.show{display:flex}
.modal.closing .sheet{animation:sheetDown .2s ease both}
.modal.closing{animation:backdropOut .2s ease both}
@keyframes sheetDown{to{transform:translateY(18px);opacity:0}}
@keyframes backdropOut{to{background:rgba(22,25,29,0);backdrop-filter:blur(0)}}
.sheet{
  width:min(720px,100%);max-height:90vh;overflow:auto;
  background:rgba(255,255,255,.98);
  border-radius:24px 24px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 50px rgba(17,22,29,.18);
  animation:sheetUp .24s cubic-bezier(.22,.8,.2,1) both;
}
@keyframes sheetUp{
  from{transform:translateY(18px);opacity:.5}
  to{transform:translateY(0);opacity:1}
}

/* ===== 第九版：新增／修改消費由下方彈出 ===== */
#addModal .sheet{animation:none;transform-origin:center bottom}
#addModal.show .sheet{animation:addSheetBounceUp .38s cubic-bezier(.18,.86,.24,1.08) both}
#addModal.closing .sheet{animation:addSheetDrop .22s cubic-bezier(.4,0,.2,1) both}
#addModal.show{animation:addModalBackdropIn .24s ease both}
@keyframes addSheetBounceUp{
  0%{transform:translateY(105%);opacity:.72}
  72%{transform:translateY(-8px);opacity:1}
  100%{transform:translateY(0);opacity:1}
}
@keyframes addSheetDrop{to{transform:translateY(105%);opacity:.72}}
@keyframes addModalBackdropIn{from{background:rgba(22,25,29,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}to{background:rgba(22,25,29,.34);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}}
#addModal.is-editing .confirm{background:linear-gradient(135deg,#273242,#171b21)}
.sheet-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 -14px 14px;padding:0 14px 12px;
}
#settingsModal .sheet-head{
  position:sticky;top:-16px;z-index:10;
  background:rgba(255,255,255,.96);
  padding-top:16px;
  border-bottom:1px solid rgba(228,230,234,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sheet-head h3{font-size:17px;margin:0}
.close{
  width:35px;height:35px;border:0;border-radius:50%;
  background:var(--soft);font-size:19px;color:#4f555d;
  transition:transform .14s ease, background .14s ease
}
.close:hover{background:#e8eaee;transform:rotate(4deg)}
.close:active{transform:scale(.96)}

.field{margin-bottom:11px}
.field label{
  display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px
}
input,select{
  width:100%;border:1px solid var(--line);border-radius:12px;
  background:#fff;padding:11px 10px;outline:none;color:var(--text);
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease
}
input:focus,select:focus{
  border-color:#aeb5bf;
  box-shadow:0 0 0 3px rgba(95,111,255,.08);
  background:#fff
}
.confirm{
  width:100%;border:0;border-radius:13px;
  background:linear-gradient(135deg,#15171a,#2f343b);
  color:#fff;padding:13px;font-weight:850;
  box-shadow:0 9px 22px rgba(18,22,28,.14);
  transition:transform .15s ease, box-shadow .15s ease
}
.confirm:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(18,22,28,.18)}
.confirm:active{transform:translateY(0) scale(.99)}


.offer-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:#eef0f3;padding:4px;border-radius:13px;margin-bottom:12px
}
.offer-tab{
  border:0;background:transparent;border-radius:10px;padding:9px 8px;
  font-size:12px;font-weight:820;color:var(--muted);
  transition:background .15s ease,color .15s ease,box-shadow .15s ease
}
.offer-tab.active{
  background:#fff;color:var(--text);
  box-shadow:0 3px 10px rgba(20,26,34,.07)
}
.offer-panel.hidden{display:none}

.settings-editor.hidden{display:none!important}
.settings-card{
  border:1px solid rgba(226,229,234,.95);border-radius:16px;
  padding:13px;margin-bottom:10px;background:#fff;
  box-shadow:0 6px 18px rgba(20,26,34,.04)
}
.settings-title{
  display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px
}
.settings-title h4{margin:0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{grid-column:1/-1}
.subhead{
  font-size:11px;font-weight:800;color:var(--muted);
  margin:4px 0 8px;padding-top:9px;border-top:1px solid var(--line)
}
.toggle-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0 3px
}
.toggle-row span{font-size:12px;font-weight:750}
.switch{
  position:relative;width:44px;height:26px;background:#d9dce1;border-radius:999px;cursor:pointer
}
.switch input{display:none}
.switch i{
  position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;
  box-shadow:0 1px 4px rgba(0,0,0,.18);transition:.16s
}
.switch input:checked + i{left:21px}
.switch:has(input:checked){background:#111}
.welcome-fields.hidden{display:none}
.save-row{display:flex;gap:8px;margin-top:8px}
.save-row button{
  flex:1;border:0;border-radius:11px;padding:10px;font-size:12px;font-weight:750
}
.save{background:linear-gradient(135deg,#17191d,#30353c);color:#fff}
.remove{background:#fff1f1;color:var(--bad)}
.add-card{
  width:100%;border:1px dashed #cfd2d7;border-radius:13px;background:#fafafa;
  padding:11px;font-weight:750
}
.tiny{font-size:10.5px;color:var(--muted);line-height:1.4}

@media(max-width:460px){
  .grid2{grid-template-columns:1fr 1fr}
}


/* 簽賬類別標籤 */
.category-input-row{display:grid;grid-template-columns:1fr 42px;gap:7px}
.category-add{
  border:0;border-radius:11px;background:var(--soft);font-weight:900;font-size:18px;
  color:#4f5660;transition:transform .15s ease,background .15s ease
}
.category-add:hover{background:#e8ebef;transform:translateY(-1px)}
.category-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cat-chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid #e1e4e9;
  border-radius:999px;background:#f6f7f9;padding:5px 8px;font-size:10.5px;
  font-weight:760;color:#4f5660
}
.cat-chip span{font-size:13px;color:#9298a1;line-height:1}

/* 新增消費：計入目標 */
.target-label{font-size:11px;color:var(--muted);font-weight:700;margin:2px 0 6px}
.target-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.target-pick{
  position:relative;display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:12px;background:#fff;
  padding:10px 11px;cursor:pointer;user-select:none;
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease
}
.target-pick input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.target-dot{
  width:18px;height:18px;border-radius:6px;border:1.5px solid #c9cdd4;
  display:grid;place-items:center;flex:0 0 auto;font-size:12px;color:white;
  transition:.15s ease
}
.target-pick strong{font-size:11.5px}
.target-pick small{display:block;color:var(--muted);font-size:9.5px;margin-top:1px}
.target-pick:has(input:checked){
  border-color:rgba(70,85,230,.24);background:rgba(88,103,255,.055);
  box-shadow:0 3px 12px rgba(50,62,160,.05)
}
.target-pick:has(input:checked) .target-dot{
  border-color:#5967ff;background:#5967ff
}
.target-pick:has(input:checked) .target-dot::after{content:"✓"}
.target-pick.welcome:has(input:checked){
  border-color:rgba(194,132,27,.25);background:rgba(245,182,54,.07)
}
.target-pick.welcome:has(input:checked) .target-dot{
  border-color:#c98b24;background:#c98b24
}

/* 達標慶祝：白色由左掃成金色 */
.goal > *{position:relative;z-index:2}
.goal.completed{overflow:hidden}
.goal.completed::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(105deg,rgba(255,255,255,.05),rgba(255,239,182,.86) 55%,rgba(250,219,113,.66));
  transform:scaleX(0);transform-origin:left center;
  animation:goldSweep .9s cubic-bezier(.2,.76,.22,1) .18s forwards
}
@keyframes goldSweep{
  0%{transform:scaleX(0)}
  100%{transform:scaleX(1)}
}
.trophy{
  display:inline-block;margin-left:5px;font-size:15px;vertical-align:-1px;
  opacity:0;transform:scale(.35) rotate(-12deg);
  animation:trophyPop .48s cubic-bezier(.2,1.35,.35,1) 1.02s forwards
}
@keyframes trophyPop{
  to{opacity:1;transform:scale(1) rotate(0)}
}
.goal.completed .goal-card,
.goal.completed .goal-meta,
.goal.completed .goal-status{color:#76601e}
.goal.completed .goal-percent{color:#8a6410}
.goal.completed .goal-days.good{
  color:#76550d;background:rgba(255,255,255,.48);border-color:rgba(139,101,16,.12)
}
.tx-target{
  display:inline-flex;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800;
  background:#eef0ff;color:#5967c8
}
.tx-target.welcome{background:#fff4d7;color:#9b6a12}


button,label.switch,.offer-tab,.cat-chip,.target-pick,.tx{
  -webkit-tap-highlight-color:transparent
}
.offer-panel{
  animation:panelFade .22s ease both
}
@keyframes panelFade{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

.existing-list{
  display:grid;gap:8px;margin-bottom:12px
}
.existing-card{
  position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;
  align-items:center;overflow:hidden;
  border:1px solid rgba(226,229,234,.95);border-radius:14px;
  background:#fff;padding:11px 12px;cursor:pointer;
  box-shadow:0 5px 16px rgba(20,26,34,.035);
  transition:background .16s ease,transform .16s ease
}
.existing-card:hover{background:#fafbfc}
.existing-card:active{transform:scale(.995)}
.existing-card-main{min-width:0}
.existing-card-name{
  font-size:13px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.existing-card-sub{
  margin-top:3px;font-size:10.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.modify-btn{
  width:0;opacity:0;overflow:hidden;pointer-events:none;
  transform:translateX(14px) scale(.88);

/* 新增消費：Apple Pay 式左右掃信用卡 */
.tx-card-carousel-field{margin-bottom:14px}
.tx-card-carousel{
  --wallet-card-w:min(72vw,300px);
  display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  padding:7px calc(50% - (var(--wallet-card-w) / 2)) 14px;
  margin:0 -10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;cursor:grab
}
.tx-card-carousel:active{cursor:grabbing}
.tx-card-carousel::-webkit-scrollbar{display:none}
.tx-card-slide{
  --card-scale:.91;--card-y:7px;--card-opacity:.46;
  flex:0 0 var(--wallet-card-w);scroll-snap-align:center;scroll-snap-stop:always;
  border:0;background:transparent;padding:0;text-align:left;opacity:var(--card-opacity);
  transform:translateY(var(--card-y)) scale(var(--card-scale));
  transform-origin:center center;transition:box-shadow .18s ease;
  -webkit-tap-highlight-color:transparent
}
.tx-card-slide:focus-visible{outline:3px solid rgba(89,103,255,.20);outline-offset:5px;border-radius:22px}
.tx-wallet-card{
  position:relative;height:174px;border-radius:20px;padding:19px 20px 17px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  background:linear-gradient(145deg,#17191d,#383e48);

  content:"";position:absolute;inset:auto -20px -75px auto;width:190px;height:140px;
  border-radius:50%;background:rgba(255,255,255,.065);transform:rotate(-18deg);pointer-events:none
}
.tx-card-slide.tone-1 .tx-wallet-card{background:linear-gradient(145deg,#253569,#647bd2)}
.tx-card-slide.tone-2 .tx-wallet-card{background:linear-gradient(145deg,#123f3b,#2d8b76)}
.tx-card-slide.tone-3 .tx-wallet-card{background:linear-gradient(145deg,#5a321f,#c57b47)}
.tx-card-slide.tone-4 .tx-wallet-card{background:linear-gradient(145deg,#4c254a,#a35c91)}
.tx-card-slide.tone-5 .tx-wallet-card{background:linear-gradient(145deg,#22384e,#4a83a9)}
.tx-wallet-top,.tx-wallet-bottom{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tx-wallet-chip{
  width:36px;height:27px;border-radius:7px;background:linear-gradient(135deg,#f5e2a9,#b9934d);
  box-shadow:inset 0 0 0 1px rgba(65,45,12,.17);position:relative
}
.tx-wallet-chip::before,.tx-wallet-chip::after{content:"";position:absolute;background:rgba(103,76,24,.22)}

.tx-wallet-chip::after{height:1px;left:0;right:0;top:50%}
.tx-wallet-type{font-size:10px;font-weight:820;letter-spacing:.08em;opacity:.76}
.tx-wallet-name{position:relative;z-index:2;font-size:19px;font-weight:820;line-height:1.25;letter-spacing:-.25px;max-width:92%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

function localDateStr(){

  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function localMonthStr(){return localDateStr().slice(0,7)}

    updateTxCardCarouselVisual(false);
  });
}
function selectedTxCard(){return cardByKey(document.getElementById('txCard')?.value||'')}
function updateTxCardCarouselVisual(commit=true){
  const carousel=document.getElementById('txCardCarousel'),input=document.getElementById('txCard'),label=document.getElementById('txCardSelectedLabel');
  if(!carousel||!input)return;
  const slides=[...carousel.querySelectorAll('.tx-card-slide')];if(!slides.length)return;
  const center=carousel.scrollLeft+carousel.clientWidth/2,maxDist=Math.max(1,carousel.clientWidth*.72);
  let nearest=slides[0],nearestDist=Infinity;
  slides.forEach(slide=>{
    const slideCenter=slide.offsetLeft+slide.offsetWidth/2,dist=Math.abs(slideCenter-center),ratio=Math.min(1,dist/maxDist);
    slide.style.setProperty('--card-scale',(1-ratio*.09).toFixed(3));slide.style.setProperty('--card-y',`${(ratio*8).toFixed(1)}px`);slide.style.setProperty('--card-opacity',(1-ratio*.56).toFixed(3));
    if(dist<nearestDist){nearestDist=dist;nearest=slide}
  });
  slides.forEach(slide=>slide.classList.toggle('is-active',slide===nearest));
  if(!commit)return;
  const key=nearest.dataset.cardKey||'',changed=input.value!==key;input.value=key;
  const card=cardByKey(key);if(label){label.classList.toggle('has-card',!!card);label.textContent=card?.name||''}
  if(changed)input.dispatchEvent(new Event('change',{bubbles:true}));
  else renderTxCategories();
}
function bindTxCardCarousel(){

  carousel.querySelectorAll('.tx-card-slide').forEach(slide=>{

  });
  carousel.onscroll=()=>{if(txCardScrollFrame)cancelAnimationFrame(txCardScrollFrame);txCardScrollFrame=requestAnimationFrame(()=>updateTxCardCarouselVisual(false));clearTimeout(txCardCommitTimer);txCardCommitTimer=setTimeout(()=>updateTxCardCarouselVisual(true),95)};

function renderTxCategories(){

  select.disabled=false;
  const cats=[...new Set(card.targets.flatMap(t=>Array.isArray(t.rebateCategories)?t.rebateCategories:[]).map(x=>String(x).trim()).filter(Boolean))];
  const options=cats.length?cats:['一般簽賬'];

function targetAutoMatches(t,category,date=localDateStr(),amount=0){
  const b=offerBounds(t);if(b.start&&date<b.start)return false;if(b.end&&date>b.end)return false;
  if(Number(t.minTransaction||0)>0&&Number(amount||0)<Number(t.minTransaction))return false;
  if(t.mechanic==='stamp'&&Number(amount||0)<Number(t.stampTransactionMin||0))return false;
  const cats=Array.isArray(t.rebateCategories)?t.rebateCategories.filter(Boolean):[];
  if(t.eligibilityMode==='categories')return category!=='__other__'&&cats.includes(category);
  return category!=='__other__';
}

function renderSummaryStep(t){

  let rule='';if(t.mechanic==='standard')rule=`累積簽滿 ${money(t.spendRequirement)} 後，回贈 ${t.rebateRate}%`;
  else if(t.mechanic==='tier_rate')rule=[...t.tiers].sort((a,b)=>a.threshold-b.threshold).map(x=>`${money(x.threshold)} → ${x.rate}%`).join('；');
  else if(t.mechanic==='milestone'||t.mechanic==='custom')rule=[...t.milestones].sort((a,b)=>a.threshold-b.threshold).map(x=>`${money(x.threshold)} → ${rewardValueLabel(x.rewardType,x.reward)}`).join('；');
  else if(t.mechanic==='recurring')rule=`每期簽滿 ${money(t.recurringThreshold)} → ${rewardValueLabel(t.recurringRewardType,t.recurringReward)}${t.completionBonus>0?`；全部完成再 ${rewardValueLabel(t.completionBonusType,t.completionBonus)}`:''}`;
  else if(t.mechanic==='stamp')rule=`單次滿 ${money(t.stampTransactionMin)} 得 ${t.stampsPerTxn} 印花；`+[...t.stampMilestones].sort((a,b)=>a.count-b.count).map(x=>`${x.count} 個 → ${rewardValueLabel(x.rewardType,x.reward)}`).join('；');
  return `<div class="wizard-question">確認優惠</div><div class="wizard-help">系統已將之前答案翻譯成人話；確認無誤就儲存。</div><div class="wizard-summary"><h4>${esc(t.name||'未命名信用卡')} · ${esc(t.targetType==='welcome'?'迎新優惠':'簽賬回贈')}</h4><div class="wizard-summary-line"><b>玩法：</b>${esc(mechanicLabel(t))}</div><div class="wizard-summary-line"><b>合資格：</b>${esc(cats)}${t.minTransaction>0?`；每筆至少 ${money(t.minTransaction)}`:''}</div><div class="wizard-summary-line"><b>計算週期：</b>${esc(period)}${t.startDate?`；${t.startDate} 起`:''}${t.endDate?` 至 ${t.endDate}`:''}</div><div class="wizard-summary-line"><b>達標規則：</b>${esc(rule||'—')}</div><div class="wizard-summary-line"><b>上限：</b>${t.capType==='none'||!t.capAmount?'沒有另外設定':`${t.capType==='reward'?'獎賞／回贈':'合資格簽賬'}每期最多 ${money(t.capAmount)}`}</div></div><button class="wizard-answer" type="button" onclick="saveTarget('${t.id}')">確認新增／儲存</button>${creatingNewTarget?'':`<button class="wizard-danger" type="button" onclick="removeTarget('${t.id}')">刪除呢個優惠</button>`}`;
}
function syncEditorDraft(id){
  const panel=document.querySelector(`.settings-card[data-id="${id}"]`),t=state.cards.find(x=>x.id===id);if(!panel||!t)return;
  panel.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(el.type==='number')t[k]=Math.max(0,parseFloat(el.value)||0);else t[k]=el.value});
  const name=panel.querySelector('.card-name-input');if(name)t.name=name.value;
  const active=[...panel.querySelectorAll('.wizard-category-btn.active')].map(x=>x.dataset.value),custom=[...panel.querySelectorAll('.custom-category-tags .cat-chip')].map(x=>x.dataset.value);if(panel.querySelector('.wizard-category-btn'))t.rebateCategories=[...new Set([...active,...custom].filter(Boolean))];
  const tierRows=[...panel.querySelectorAll('[data-tier-row]')];if(tierRows.length)t.tiers=tierRows.map(r=>({threshold:Math.max(0,Number(r.querySelector('[data-tier-threshold]')?.value||0)),rate:Math.max(0,Number(r.querySelector('[data-tier-rate]')?.value||0))}));
  const msRows=[...panel.querySelectorAll('[data-milestone-row]')];if(msRows.length)t.milestones=msRows.map(r=>({threshold:Math.max(0,Number(r.querySelector('[data-ms-threshold]')?.value||0)),rewardType:cleanRewardType(r.querySelector('[data-ms-type]')?.value),reward:Math.max(0,Number(r.querySelector('[data-ms-reward]')?.value||0))}));
  const stampRows=[...panel.querySelectorAll('[data-stamp-row]')];if(stampRows.length)t.stampMilestones=stampRows.map(r=>({count:Math.max(1,Number(r.querySelector('[data-stamp-count]')?.value||1)),rewardType:cleanRewardType(r.querySelector('[data-stamp-type]')?.value),reward:Math.max(0,Number(r.querySelector('[data-stamp-reward]')?.value||0))}));
}
function validateWizardStep(t,step=wizardStep){
  if(step===1&&!String(t.name||'').trim()){alert('請先選擇或輸入信用卡名稱');return false}
  if(step===4&&t.eligibilityMode==='categories'&&!(t.rebateCategories||[]).length){alert('請至少選擇一個簽賬類別');return false}
  if(step===7&&t.periodType==='approval_window'&&!t.approvalDate){alert('請輸入批卡日期');return false}
  if(step===8&&t.mechanic==='recurring'&&(!t.startDate||!t.endDate)){alert('分期／連續達標需要設定推廣開始及結束日期');return false}
  return true;
}
window.wizardBack=()=>{if(!creatingNewTarget||wizardStep<=1)return;transitionWizard(wizardStep-1,'back',true)};
window.chooseWizardCard=(btn,key,name)=>answerAdvance(btn,t=>{t.cardKey=decodeURIComponent(key);t.name=decodeURIComponent(name)},2);
window.useWizardCardName=(btn,id)=>{const t=state.cards.find(x=>x.id===id);if(!t)return;syncEditorDraft(id);t.name=String(t.name||'').trim();if(!validateWizardStep(t,1))return;flashThen(btn,()=>transitionWizard(2,'forward',false))};
window.selectTargetType=(btn,id,type)=>answerAdvance(btn,t=>{t.targetType=type==='welcome'?'welcome':'rebate';if(t.targetType==='welcome'&&t.periodType==='monthly')t.periodType='approval_window'},3);
window.selectMechanic=(btn,id,k)=>answerAdvance(btn,t=>{t.mechanic=MECHANICS.some(x=>x[0]===k)?k:'standard';if(t.mechanic==='custom'&&!t.milestones.length)t.milestones=[{threshold:0,rewardType:'現金回贈',reward:0}];if(t.mechanic==='recurring')t.periodType='campaign'},4);
window.selectEligibility=(btn,id,m)=>answerAdvance(btn,t=>{t.eligibilityMode=m==='categories'?'categories':'all'},5);
window.openCategoryPicker=(btn,id)=>{const t=state.cards.find(x=>x.id===id);if(!t)return;syncEditorDraft(id);t.eligibilityMode='categories';flashThen(btn,()=>renderSettings())};
window.finishCategories=(btn,id)=>{const t=state.cards.find(x=>x.id===id);if(!t)return;syncEditorDraft(id);if(!validateWizardStep(t,4))return;flashThen(btn,()=>transitionWizard(5,'forward',false))};
window.clearLimitsAndAdvance=(btn,id)=>answerAdvance(btn,t=>{t.minTransaction=0;t.capType='none';t.capAmount=0},6);
window.finishLimits=(btn,id)=>{const t=state.cards.find(x=>x.id===id);if(!t)return;syncEditorDraft(id);if(t.capType==='none')t.capAmount=0;flashThen(btn,()=>transitionWizard(6,'forward',false))};
window.selectPeriod=(btn,id,p)=>answerAdvance(btn,t=>{t.periodType=['monthly','campaign','yearly','approval_window'].includes(p)?p:'monthly'},7);
window.clearDatesAndAdvance=(btn,id)=>answerAdvance(btn,t=>{t.startDate='';t.endDate=''},8);
window.finishDates=(btn,id)=>{const t=state.cards.find(x=>x.id===id);if(!t)return;syncEditorDraft(id);if(!validateWizardStep(t,7))return;flashThen(btn,()=>transitionWizard(8,'forward',false))};
window.finishRules=(btn,id)=>{const t=state.cards.find(x=>x.id===id);if(!t)return;syncEditorDraft(id);if(!validateWizardStep(t,8))return;flashThen(btn,()=>transitionWizard(9,'forward',false))};
window.togglePresetCategory=btn=>btn.classList.toggle('active');
window.addCategoryTag=btn=>{const panel=btn.closest('.settings-card'),input=panel?.querySelector('.category-new');if(!input)return;const value=input.value.trim();if(!value)return;const preset=[...panel.querySelectorAll('.wizard-category-btn')].find(x=>x.dataset.value===value);if(preset){preset.classList.add('active');input.value='';return}const tags=panel.querySelector('.custom-category-tags'),exists=[...tags.querySelectorAll('.cat-chip')].some(x=>x.dataset.value===value);if(!exists){const chip=document.createElement('button');chip.type='button';chip.className='cat-chip';chip.dataset.value=value;chip.innerHTML=`${esc(value)} <span>×</span>`;chip.onclick=()=>chip.remove();tags.appendChild(chip)}input.value=''};
window.addRuleRow=kind=>{const t=state.cards.find(x=>x.id===editingTargetId);if(!t)return;syncEditorDraft(t.id);if(kind==='tier')t.tiers.push({threshold:0,rate:0});if(kind==='milestone')t.milestones.push({threshold:0,rewardType:'現金回贈',reward:0});if(kind==='stamp')t.stampMilestones.push({count:1,rewardType:'現金回贈',reward:0});creatingNewTarget?renderSettings():rerenderEditPreserveScroll()};
window.removeRuleRow=(kind,i)=>{const t=state.cards.find(x=>x.id===editingTargetId);if(!t)return;syncEditorDraft(t.id);const arr=kind==='tier'?t.tiers:kind==='stamp'?t.stampMilestones:t.milestones;if(arr.length>1)arr.splice(i,1);creatingNewTarget?renderSettings():rerenderEditPreserveScroll()};
function resolveCardKeyForTarget(t,name){const norm=normalizeCardName(name),sameName=state.cards.find(x=>!x._temporary&&x.id!==t.id&&normalizeCardName(x.name)===norm);if(sameName)return sameName.cardKey;const siblings=state.cards.filter(x=>!x._temporary&&x.id!==t.id&&x.cardKey===t.cardKey);if(!t.cardKey)return uid();if(siblings.length&&siblings.some(x=>normalizeCardName(x.name)!==norm))return uid();return t.cardKey}
window.saveTarget=id=>{
  syncEditorDraft(id);const t=state.cards.find(x=>x.id===id);if(!t)return;t.name=String(t.name||'').trim();if(!t.name){wizardStep=1;renderSettings();alert('請輸入或選擇信用卡名稱');return}
  if(t.periodType==='approval_window'&&!t.approvalDate){wizardStep=7;renderSettings();alert('請輸入批卡日期');return}
  if(t.mechanic==='recurring'&&(!t.startDate||!t.endDate)){wizardStep=7;renderSettings();alert('請設定分期優惠開始及結束日期');return}
  if(t.capType==='none')t.capAmount=0;t.rebateEndDate=t.endDate||'';if(t.milestones.length){const first=[...t.milestones].sort((a,b)=>a.threshold-b.threshold)[0];t.welcomeRequirement=first.threshold;t.welcomeRewardType=first.rewardType;t.welcomeReward=first.reward}
  t.cardKey=resolveCardKeyForTarget(t,t.name);delete t._temporary;save();creatingNewTarget=false;editingTargetId=null;editingBackup=null;wizardStep=1;render();renderSettings();closeModal('settingsModal');
};
window.removeTarget=id=>{const t=state.cards.find(x=>x.id===id);if(!t)return;if(!confirm(`刪除「${t.name}」呢個優惠？消費紀錄會保留。`))return;state.cards=state.cards.filter(x=>x.id!==id);state.transactions.forEach(tx=>{tx.targetIds=(tx.targetIds||[]).filter(x=>x!==id);tx.targetRefs=(tx.targetRefs||[]).filter(x=>x.id!==id)});save();editingTargetId=null;creatingNewTarget=false;editingBackup=null;wizardStep=1;render();renderSettings();closeModal('settingsModal')};

document.addEventListener('click',e=>{if(!e.target.closest('.card-name-picker'))document.querySelectorAll('.card-name-menu').forEach(x=>x.classList.add('hidden'))});
window.addEventListener('scroll',()=>document.querySelector('.top')?.classList.toggle('is-scrolled',window.scrollY>6),{passive:true});
render();
</script>
